<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRADEBRIDGE</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230d1a2c%27/%3E%3Cpath d=%27M9 22V10h8%27 stroke=%27%232fd17a%27 stroke-width=%273%27 fill=%27none%27/%3E%3Cpath d=%27M15 22h8V10%27 stroke=%27%23f2c230%27 stroke-width=%273%27 fill=%27none%27/%3E%3C/svg%3E">
</head>
<body>
<div class="backdrop" id="backdrop"><div class="ribbon"></div><div class="sheen"></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span id="brand">TRADEBRIDGE</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">
      <button class="side-btn" data-page="refer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span>Refer &amp; Earn</span></button>
      <div class="side-sep"></div>
      <button class="side-btn upgrade" data-page="upgrade"><span>↗&nbsp; Upgrade Plan</span></button>
      <button class="side-link" data-page="account">My Account</button>
      <button class="side-link" id="signout">⇥&nbsp; Sign Out</button>
      <div class="cookie">Cookie settings</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="setup" id="setup">
  <div class="setup-list" id="setupList"></div>
  <button class="setup-pill" id="setupPill"><span class="n" id="setupN">1</span><span id="setupText">Setup 1/4</span><span class="chev">︿</span></button>
</div>

<div class="modal" id="modal"><div class="panel" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<div class="auth" id="auth"></div>

<script src="/static/app.js"></script>
</body>
</html>
