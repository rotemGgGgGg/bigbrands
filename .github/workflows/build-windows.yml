name: Build Windows app

on:
  push:
    branches: [claude/serene-fermi-4483ji]
    paths:
      - "trading-bot/app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: trading-bot/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -r requirements-desktop.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Build .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TRADEBRIDGE --icon icon.ico
          --add-data "bridge/static;bridge/static"
          --collect-submodules uvicorn
          --collect-all webview
          --collect-data tzdata
          desktop.py

      - name: Self-test the built .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TRADEBRIDGE.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\TRADEBRIDGE\app.log" -Tail 20
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Window test (WebView2 renders the dashboard)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TRADEBRIDGE.exe" -ArgumentList "--windowtest" -Wait -PassThru
          Get-Content "$env:APPDATA\TRADEBRIDGE\app.log" -Tail 25
          if ($p.ExitCode -ne 0) { throw "window test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v5
        with:
          name: TRADEBRIDGE-windows
          path: trading-bot/app/dist/TRADEBRIDGE.exe
          if-no-files-found: error
