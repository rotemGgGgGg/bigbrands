name: Build Telegram bot chat .exe

on:
  workflow_dispatch:
  push:
    paths:
      - "telegram-bot/**"
      - ".github/workflows/build-telegram-bot.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: telegram-bot
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        working-directory: telegram-bot
        run: pyinstaller --onefile --noconsole --name TelegramBotChat chat.py
      - name: Package
        working-directory: telegram-bot
        run: |
          Copy-Item config.example.json dist/config.example.json
          Copy-Item README.md dist/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramBotChat
          path: telegram-bot/dist/
