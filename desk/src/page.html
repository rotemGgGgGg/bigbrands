<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tape">
<meta name="robots" content="noindex, nofollow">
<title>Tape</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #11142d;
  --ink-2: #4b4f63;
  --ink-3: #8a8fa3;
  --line: rgba(17, 20, 45, 0.06);
  --card: #ffffff;
  --field: #ffffff;
  --panel: #eef1f8;
  --side-a: #fcedf3;
  --side-b: #eef1fb;
  --main: #eef1fb;
  --right: rgba(255, 255, 255, 0.82);
  --green: #22c55e;
  --up: #16a34a;
  --down: #ef4444;
  --cyan: #4fc3e8;
  --pink: #ec6fd6;
  --shadow: 0 10px 30px rgba(31, 38, 89, 0.06);
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-theme="night"] {
  --ink: #eef0fa;
  --ink-2: #b4b8cc;
  --ink-3: #7c8199;
  --line: rgba(255, 255, 255, 0.07);
  --card: #1b1f33;
  --field: #22273d;
  --panel: #171b2d;
  --side-a: #1c1730;
  --side-b: #12152a;
  --main: #12152a;
  --right: rgba(20, 23, 40, 0.92);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(900px 500px at 78% 92%, rgba(134, 239, 172, 0.35), transparent 60%),
    radial-gradient(700px 500px at 45% 0%, rgba(199, 210, 254, 0.45), transparent 60%),
    var(--main);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 390px;
  min-height: 100vh;
}

/* ---------- sidebar ---------- */
.side {
  background: linear-gradient(180deg, var(--side-a) 0%, var(--side-b) 70%);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.logo {
  height: 98px; display: flex; align-items: center; gap: 16px;
  padding: 0 30px; border-bottom: 1px solid var(--line);
}
.logo svg { flex: none; }
.logo span { font: 700 15px/1.05 "Syncopate", var(--font); letter-spacing: 0.12em; }
.nav { padding: 22px 22px 0; display: flex; flex-direction: column; gap: 19px; }
.nav a {
  height: 40px; display: flex; align-items: center; gap: 14px;
  padding: 0 12px; border-radius: 4px;
  font-size: 17px; font-weight: 500; color: var(--ink-3);
  transition: color .2s ease;
}
.nav a:hover { color: var(--ink-2); }
.nav a svg { width: 19px; height: 19px; flex: none; }
.nav a[aria-current="page"] {
  color: #0d1b12;
  background: linear-gradient(90deg, #12b04f 0%, #2fd06a 55%, #7be7a2 100%);
  box-shadow: 0 6px 18px rgba(34, 197, 94, 0.28);
}
.side-foot { margin-top: auto; padding: 0 22px 38px; }
.side-links { display: flex; flex-direction: column; gap: 10px; padding: 0 13px 70px; }
.side-links a { font-size: 14px; color: var(--ink-3); display: inline-flex; gap: 8px; align-items: center; }
.side-links a:hover { color: var(--ink-2); }
.status-card {
  position: relative; display: block; background: #0f1220; color: #fff;
  border-radius: 10px; padding: 50px 14px 16px;
}
.status-card .badge {
  position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
  width: 76px; height: 76px; border-radius: 22px;
  display: grid; place-items: center;
  background: linear-gradient(140deg, #6ef3b9, #23c160 60%, #5aa9f5);
  box-shadow: 0 10px 30px rgba(35, 193, 96, 0.35);
}
.status-card .badge.off { background: linear-gradient(140deg, #9aa0b6, #4b506a); box-shadow: none; }
.status-card strong { display: block; font-size: 20px; font-weight: 600; line-height: 1.2; }
.status-card small { display: block; font-size: 12px; color: #a8aec4; margin-top: 4px; line-height: 1.35; }

/* ---------- main ---------- */
.main { padding: 0 59px 60px; min-width: 0; }
.head {
  height: 98px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  border-bottom: 1px solid var(--line); margin: 0 -59px; padding: 0 59px;
}
.head h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.01em; }
.search {
  width: 302px; height: 48px; border-radius: 24px; background: var(--card);
  display: flex; align-items: center; gap: 10px; padding: 0 18px;
  box-shadow: var(--shadow);
}
.search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 13px; }
.search input::placeholder { color: var(--ink-3); }
.balance-row { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 14px; gap: 20px; }
.balance-row .lbl { font-size: 16px; color: var(--ink-2); }
.balance-row .amt { font-size: 32px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
.balance-row .amt small { font-size: 14px; font-weight: 500; margin-left: 8px; }
.tabs {
  display: flex; padding: 4px; background: var(--card); border-radius: 6px;
  box-shadow: var(--shadow); margin-top: 8px;
}
.tabs button {
  border: 0; background: transparent; cursor: pointer;
  font-size: 12px; font-weight: 500; color: var(--ink-3);
  padding: 4px 18px; border-radius: 4px;
}
.tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; }

.chart-card {
  margin-top: 12px; background: var(--card); border-radius: 16px;
  padding: 24px 22px 18px; box-shadow: var(--shadow);
}
.chart-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ranges { display: flex; align-items: center; gap: 4px; }
.ranges button {
  border: 0; background: transparent; cursor: pointer;
  font-size: 14px; font-weight: 500; color: var(--ink-3);
  width: 35px; height: 35px; border-radius: 8px; display: grid; place-items: center;
}
.ranges button[aria-pressed="true"] { background: var(--panel); color: var(--ink-2); }
.pairs { display: flex; align-items: center; gap: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 10px 0 5px; border-radius: 4px;
  font-size: 12px; font-weight: 600; border: 0; cursor: pointer;
}
.chip i { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 12px; }
.chip.a { background: rgba(79, 195, 232, 0.12); }
.chip.a i { background: rgba(79, 195, 232, 0.25); color: #1b88b0; }
.chip.b { background: rgba(236, 111, 214, 0.12); }
.chip.b i { background: rgba(236, 111, 214, 0.25); color: #b0309a; }
.swap { border: 0; background: none; cursor: pointer; color: var(--ink-3); padding: 4px; }
.chart { margin-top: 10px; position: relative; }
.chart svg { display: block; width: 100%; height: 200px; overflow: visible; }
.chart .ax { font-size: 10px; fill: var(--ink-3); font-family: var(--font); }
.tip {
  position: absolute; pointer-events: none; transform: translate(-50%, -120%);
  background: var(--ink); color: var(--card); font-size: 11px; font-weight: 500;
  padding: 5px 9px; border-radius: 6px; white-space: nowrap;
}

.below { display: grid; grid-template-columns: minmax(0, 1fr) 216px; gap: 16px; margin-top: 26px; }
.below h2 { grid-column: 1 / -1; margin: 0 0 -4px; font-size: 20px; font-weight: 600; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stat {
  background: var(--card); border-radius: 6px; padding: 18px 20px 16px;
  box-shadow: var(--shadow); min-height: 150px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.stat .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.stat .ico { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.stat svg.spark { width: 118px; height: 40px; overflow: visible; }
.stat .name { font-size: 14px; color: var(--ink-2); margin-top: 14px; }
.stat .name small { font-size: 9px; color: var(--ink-3); margin-left: 4px; letter-spacing: .04em; }
.stat .val { font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
.promo {
  position: relative; border-radius: 6px; padding: 52px 18px 18px;
  background: linear-gradient(160deg, #c8f78f 0%, #a6f0b2 35%, #b9d8ff 75%, #a6f5c6 100%);
  color: #11142d; min-height: 316px; overflow: hidden;
}
.promo h3 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.3; }
.promo p { font-size: 13px; color: #4b5563; margin: 14px 0 0; line-height: 1.45; }
.promo .meter { height: 6px; border-radius: 3px; background: rgba(17, 20, 45, 0.12); margin-top: 8px; overflow: hidden; }
.promo .meter span { display: block; height: 100%; background: #11142d; border-radius: 3px; }
.promo .x {
  position: absolute; top: 14px; right: 14px; width: 18px; height: 18px; border-radius: 50%;
  background: #11142d; color: #fff; border: 0; cursor: pointer; display: grid; place-items: center; padding: 0;
}
.promo .go { position: absolute; right: 18px; bottom: 18px; }

/* ---------- other views ---------- */
.view-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 14px; }
.view-title h2 { margin: 0; font-size: 20px; font-weight: 600; }
.view-title span { font-size: 13px; color: var(--ink-3); }
.table { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.tr {
  display: grid; grid-template-columns: 110px 110px minmax(150px, 1fr) 90px 110px 96px;
  gap: 12px; align-items: center; padding: 14px 22px; font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.tr:last-child { border-bottom: 0; }
.tr.h { font-size: 11px; color: var(--ink-3); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.side-tag { font-weight: 600; }
.side-tag small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 500; }
.pill {
  justify-self: end; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  background: var(--panel); color: var(--ink-2); white-space: nowrap;
}
.pill.tp, .pill.taken { background: rgba(34, 197, 94, .14); color: var(--up); }
.pill.sl, .pill.failed { background: rgba(239, 68, 68, .12); color: var(--down); }
.pill.open, .pill.pending { background: rgba(79, 195, 232, .16); color: #1b88b0; }
.up { color: var(--up); }
.down { color: var(--down); }
.muted { color: var(--ink-3); }
.empty { padding: 48px 24px; text-align: center; color: var(--ink-3); font-size: 14px; }
.empty b { display: block; color: var(--ink); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.sig { padding: 16px 22px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 110px 1fr auto; gap: 6px 16px; font-size: 13px; }
.sig:last-child { border-bottom: 0; }
.sig .why { grid-column: 2 / -1; color: var(--ink-3); font-size: 12px; }
.sig details { grid-column: 2 / -1; }
.sig summary { cursor: pointer; font-size: 12px; color: var(--ink-3); }
.sig pre { margin: 8px 0 0; padding: 12px 14px; background: var(--panel); border-radius: 10px; white-space: pre-wrap; font: 12px/1.6 var(--font); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.kv .item { background: var(--card); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow); }
.kv .item span { display: block; font-size: 12px; color: var(--ink-3); }
.kv .item b { display: block; font-size: 20px; font-weight: 600; margin-top: 4px; }
.kv .item small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ---------- right panel ---------- */
.right { background: var(--right); border-left: 1px solid var(--line); padding: 0 38px 40px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.right-head { height: 98px; display: flex; align-items: center; justify-content: space-between; }
.icons { display: flex; gap: 14px; }
.icons button { border: 0; background: none; cursor: pointer; color: var(--ink); padding: 4px; position: relative; display: grid; place-items: center; }
.icons .dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: #ec4899; }
.me { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(140deg, #fbcfe8, #f9a8d4);
  display: grid; place-items: center; font-weight: 600; color: #831843;
}
.acct-wrap { position: relative; margin-top: 54px; padding-bottom: 14px; }
.acct-shadow { position: absolute; left: 14px; right: 14px; bottom: 0; height: 40px; border-radius: 0 0 12px 12px; background: #2b6f6b; }
.acct {
  position: relative; height: 195px; border-radius: 14px; overflow: hidden; display: flex;
  box-shadow: 0 18px 40px rgba(16, 185, 129, 0.25);
}
.acct .l {
  flex: 1; padding: 16px 18px; color: #0b1324;
  background: linear-gradient(120deg, #6ff0c8 0%, #2fd685 45%, #36c6a2 70%, #4a8ff0 100%);
  display: flex; flex-direction: column;
}
.acct .r { width: 99px; background: #1a1d2b; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 22px 0 18px; }
.acct .pre { margin-top: auto; font-size: 11px; font-weight: 500; }
.acct .digits { font-size: 21px; font-weight: 500; letter-spacing: .02em; }
.acct .digits small { font-size: 15px; letter-spacing: .1em; margin-right: 6px; }
.acct .meta { display: flex; gap: 44px; font-size: 9px; margin-top: 12px; font-weight: 500; }
.acct .brand { font: italic 800 22px/1 var(--font); letter-spacing: -0.02em; }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; align-items: center; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.dots i.on { width: 40px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #6ff0c8, #4a8ff0); }
.trade-box { margin-top: 38px; background: var(--panel); border-radius: 24px; padding: 26px 24px 22px; }
.bs { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
.bs button { border: 0; background: none; cursor: pointer; font-size: 17px; font-weight: 500; color: var(--ink-3); width: 110px; }
.bs button[aria-pressed="true"] { color: var(--ink); }
.bs .sep { width: 1px; height: 34px; background: rgba(17, 20, 45, 0.12); }
.field {
  background: var(--field); border-radius: 12px; height: 68px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.field .f-l span { display: block; font-size: 12px; color: var(--ink-2); }
.field .f-l b { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 500; margin-top: 3px; }
.field .f-l b small { font-size: 9px; color: var(--ink-3); font-weight: 500; }
.field .f-r { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 14px; }
.coin { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; background: #fde68a; font-size: 11px; color: #92400e; font-weight: 700; }
.cta {
  width: 100%; height: 56px; border: 0; border-radius: 12px; cursor: pointer; margin-top: 8px;
  background: linear-gradient(90deg, #7ff2c4 0%, #57d9b5 40%, #5a8df0 100%);
  font-size: 14px; font-weight: 600; color: #0b1324;
  box-shadow: 0 10px 24px rgba(90, 141, 240, 0.25);
  transition: filter .2s ease, transform .15s ease;
}
.cta:hover { filter: brightness(1.04); }
.cta:active { transform: scale(.99); }
.cta.paused { background: linear-gradient(90deg, #fcd34d, #fb923c); box-shadow: 0 10px 24px rgba(251, 146, 60, .25); }
.cta-note { text-align: center; font-size: 11px; color: var(--ink-3); margin-top: 10px; min-height: 1.4em; }

.demo-flag { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 20; background: #11142d; color: #fff; font-size: 11px; padding: 6px 14px; border-radius: 0 0 10px 10px; letter-spacing: .04em; }

/* ---------- lock ---------- */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.lock form { width: min(360px, 100%); background: var(--card); border-radius: 24px; padding: 36px 30px 30px; box-shadow: var(--shadow); text-align: center; }
.lock .logo { justify-content: center; border: 0; height: auto; padding: 0 0 26px; }
.lock label { display: block; text-align: left; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.lock input { width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 0 16px; font-size: 15px; outline: none; }
.lock .err { color: var(--down); font-size: 12px; min-height: 1.5em; margin-top: 10px; }
.lock .alt { display: block; margin-top: 14px; font-size: 12px; color: var(--ink-3); }

/* ---------- responsive ---------- */
.bottom-nav { display: none; }
@media (max-width: 1280px) {
  .app { grid-template-columns: 220px minmax(0, 1fr) 340px; }
  .main { padding: 0 32px 60px; }
  .head { margin: 0 -32px; padding: 0 32px; }
  .right { padding: 0 24px 40px; }
  .search { width: 220px; }
}
@media (max-width: 1100px) {
  .app { grid-template-columns: 220px minmax(0, 1fr); }
  .right { grid-column: 2; position: static; height: auto; border-left: 0; }
  .right-head { display: none; }
}
@media (max-width: 760px) {
  .app { display: block; }
  .side { display: none; }
  .main { padding: 0 16px 24px; }
  .head { margin: 0 -16px; padding: 0 16px; height: 72px; }
  .head h1 { font-size: 24px; }
  .search { display: none; }
  .balance-row { flex-direction: column; gap: 10px; }
  .tabs { margin-top: 0; }
  .below { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 14px; min-height: 130px; }
  .stat .val { font-size: 22px; }
  .stat svg.spark { width: 70px; }
  .promo { min-height: 200px; }
  .right { padding: 0 16px 110px; }
  .acct-wrap { margin-top: 20px; }
  .tr { grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 16px; }
  .tr.h { display: none; }
  .tr > :nth-child(3) { grid-column: 1 / -1; }
  .sig { grid-template-columns: 1fr auto; }
  .sig .body { grid-column: 1 / -1; }
  .kv { grid-template-columns: 1fr; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 8px 6px calc(env(safe-area-inset-bottom) + 8px);
  }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: var(--ink-3); padding: 4px 0; }
  .bottom-nav a svg { width: 20px; height: 20px; }
  .bottom-nav a[aria-current="page"] { color: var(--up); }
}
</style>
</head>
<body>

<div class="lock" id="lock" hidden>
  <form id="lock-form" autocomplete="off">
    <div class="logo"><svg width="34" height="38" viewBox="0 0 34 38"><path d="M17 1 32.6 10v18L17 37 1.4 28V10z" fill="#11142d"/><path d="M17 9.5 25 14v9.2L17 27.8 9 23.2V14z" fill="none" stroke="#fff" stroke-width="3"/></svg><span>TAPE<br>DESK</span></div>
    <label for="key">Desk key</label>
    <input id="key" type="password" autocapitalize="off" spellcheck="false" required>
    <button class="cta" type="submit">Open dashboard</button>
    <div class="err" id="lock-err" role="alert"></div>
    <a class="alt" href="?demo">See it with demo data</a>
  </form>
</div>

<div class="demo-flag" id="demo-flag" hidden>DEMO DATA</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <a class="logo" href="#dashboard"><svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 32.6 10v18L17 37 1.4 28V10z" fill="currentColor"/><path d="M17 9.5 25 14v9.2L17 27.8 9 23.2V14z" fill="none" stroke="var(--main)" stroke-width="3"/></svg><span>TAPE<br>DESK</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-links">
        <a href="#bot">Support</a>
        <a href="#rules">Documentation <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 8 8 2M3 2h5v5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a>
        <a href="https://t.me/" target="_blank" rel="noopener">Telegram <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 8 8 2M3 2h5v5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a>

  <main class="main">

</div>

<script>
(() => {
  "use strict";
  const KEY = "tape.key", THEME = "tape.theme2", PROMO = "tape.promo";
  const DEMO = new URLSearchParams(location.search).has("demo");
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MINUS = "−";
  const S = { data: null, view: "dashboard", mode: "all", range: "1m", pairA: "equity", pairB: "peak", side: "buy", q: "", timer: null };

  /* ---------- icons, in the design's thin line style ---------- */
  const I = {
    dashboard: '<svg viewBox="0 0 20 20"><path d="M10 2.5 16.8 6.4v7.2L10 17.5 3.2 13.6V6.4z" fill="currentColor"/></svg>',
    trades: '<svg viewBox="0 0 20 20"><path d="M3 7h12l-3-3M17 13H5l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    signals: '<svg viewBox="0 0 20 20"><path d="M10 3a5 5 0 0 0-5 5v3l-1.5 3h13L15 11V8a5 5 0 0 0-5-5zM8 16.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    reports: '<svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h14M7 2.5v3M13 2.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    bot: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m12.8 7.2-1.6 4-4 1.6 1.6-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    rules: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    account: '<svg viewBox="0 0 20 20"><path d="M3.5 6.5c0-1.1.9-2 2-2h9c1.1 0 2 .9 2 2v7c0 1.1-.9 2-2 2h-9c-1.1 0-2-.9-2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 10h4" stroke="currentColor" stroke-width="1.6"/></svg>',
  };
  const NAV = [["dashboard", "Dashboard"], ["trades", "Trades"], ["signals", "Signals"], ["reports", "Reports"], ["bot", "Bot"], ["rules", "Rules"], ["account", "Account"]];
  const MOBILE = ["dashboard", "trades", "signals", "reports", "account"];
  $("#nav").innerHTML = NAV.map(([k, l]) => `<a href="#${k}" data-k="${k}">${I[k]}${l}</a>`).join("");
  $("#bottom-nav").innerHTML = NAV.filter(([k]) => MOBILE.includes(k)).map(([k, l]) => `<a href="#${k}" data-k="${k}">${I[k]}${l}</a>`).join("");

  /* ---------- theme ---------- */
  const root = document.documentElement;
  try { if (localStorage.getItem(THEME) === "night") root.dataset.theme = "night"; } catch (_) {}
  $("#theme").addEventListener("click", () => {
    const night = root.dataset.theme !== "night";
    if (night) root.dataset.theme = "night"; else delete root.dataset.theme;
    try { localStorage.setItem(THEME, night ? "night" : "day"); } catch (_) {}
    if (S.data) render();
  });

  /* ---------- formatting ---------- */
  const money = (v, signed = false, dp = 2) => {
    const a = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
    return `${v < 0 ? MINUS : signed && v > 0 ? "+" : ""}$${a}`;
  };
  const price = (v) => (v == null ? "–" : Number(v).toFixed(2));
  const tone = (v) => (v > 0 ? "up" : v < 0 ? "down" : "");
  const d = (ts) => new Date(ts * 1000);
  const dayKey = (ts) => { const x = d(ts); return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`; };
  const dayName = (ts) => d(ts).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  const hhmm = (ts) => d(ts).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const ago = (s) => s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`;
  const rOf = (t) => {
    const risk = Math.abs(t.entry - t.sl);
    return risk ? (t.pips * 0.1) / risk : 0;
  };

  /* ---------- data ---------- */
  async function load() {
    if (DEMO) return demoData();
    let key = "";
    try { key = localStorage.getItem(KEY) || ""; } catch (_) {}
    if (!key) return null;
    const r = await fetch("/api/data", { headers: { authorization: `Bearer ${key}` }, cache: "no-store" });
    if (r.status === 401) {
      try { localStorage.removeItem(KEY); } catch (_) {}
      showLock("That key did not open the desk.");
      return null;
    }
    if (!r.ok) throw new Error(`desk answered ${r.status}`);
    return r.json();
  }

  function scope(trades) {
    let t = trades;
    if (S.mode === "live") t = t.filter((x) => x.mode === "live");
    if (S.mode === "paper") t = t.filter((x) => x.mode === "paper");
    if (S.mode === "today") t = t.filter((x) => dayKey(x.closed_at || x.created_at) === dayKey(S.data.now));
    return t;
  }

  function stats(trades) {
    const closed = trades.filter((t) => t.state === "closed").sort((a, b) => a.closed_at - b.closed_at);
    const wins = closed.filter((t) => t.pnl > 0), losses = closed.filter((t) => t.pnl < 0);
    const net = closed.reduce((a, t) => a + t.pnl, 0);
    const avgR = closed.length ? closed.reduce((a, t) => a + rOf(t), 0) / closed.length : 0;
    return { closed, wins, losses, net, avgR, winRate: closed.length ? wins.length / closed.length : null };
  }

  function startBalance() {
    const a = S.data.bot && S.data.bot.account;
    return a && a.start ? Number(a.start) : 5000;
  }

  /* ---------- views ---------- */
  function renderDashboard() {
    const data = S.data, acct = data.bot && data.bot.account;
    const trades = scope(data.trades), st = stats(trades);
    const bal = acct ? Number(acct.equity ?? acct.balance) : startBalance() + st.net;
    const day = st.closed.filter((t) => dayKey(t.closed_at) === dayKey(data.now)).reduce((a, t) => a + t.pnl, 0);
    let promoHidden = false;
    try { promoHidden = localStorage.getItem(PROMO) === dayKey(data.now); } catch (_) {}
    const rules = (data.bot && data.bot.rules) || {};
    const dayCap = rules.daily_stop_usd || 125, totCap = rules.total_stop_usd || 450;
    const dayUsed = acct ? Number(acct.day_loss || 0) + Number(acct.open_risk || 0) : Math.max(0, -day);
    const totUsed = acct ? Number(acct.total_loss || 0) + Number(acct.open_risk || 0) : Math.max(0, -st.net);

    $("#view").innerHTML = `
      <div class="balance-row">
        <div><div class="lbl">${acct ? "Account equity" : "Total balance"}</div>
          <div class="amt">${money(bal)}<small class="${tone(day)}">${day ? money(day, true) + " today" : ""}</small></div></div>
        <div class="tabs" role="group" aria-label="Scope">
          ${[["all", "All"], ["live", "Live"], ["paper", "Paper"], ["today", "Today"]].map(([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${S.mode === k}">${l}</button>`).join("")}
        </div>
      </div>

      <section class="chart-card">
        <div class="chart-top">
          <div class="ranges" role="group" aria-label="Range">
            ${[["1d", "1D"], ["3d", "3D"], ["1w", "1W"], ["1m", "1M"]].map(([k, l]) => `<button type="button" data-range="${k}" aria-pressed="${S.range === k}">${l}</button>`).join("")}
            <button type="button" data-range="all" aria-pressed="${S.range === "all"}" aria-label="All time"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="2.5" y="3.5" width="13" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7h13M6 2v3M12 2v3" stroke="currentColor" stroke-width="1.4"/><text x="9" y="13.4" text-anchor="middle" font-size="5.5" font-weight="700" fill="currentColor">ALL</text></svg></button>
          </div>
          <div class="pairs">
            <button type="button" class="chip a" data-pair="A"><i>$</i>${label(S.pairA)} <svg width="8" height="8" viewBox="0 0 8 8"><path d="m1 3 3 3 3-3" fill="currentColor"/></svg></button>
            <button type="button" class="swap" id="swap" aria-label="Swap"><svg width="18" height="14" viewBox="0 0 18 14"><path d="M2 4h13l-3-3M16 10H3l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button type="button" class="chip b" data-pair="B"><i>$</i>${label(S.pairB)} <svg width="8" height="8" viewBox="0 0 8 8"><path d="m1 3 3 3 3-3" fill="currentColor"/></svg></button>
          </div>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <div class="below">
        <h2>Performance</h2>
        <div class="cards">
          ${statCard("winrate", "Win rate", "CLOSED", st.winRate == null ? "–" : (st.winRate * 100).toFixed(1) + "%", sparkWin(st))}
          ${statCard("net", "Net P&L", st.closed.length ? "USD" : "", st.closed.length ? money(st.net, true) : "–", sparkEquity(st))}
          ${statCard("count", "Trades", "CLOSED", String(st.closed.length), sparkCount(st))}
          ${statCard("r", "Per trade", "AVG R", st.closed.length ? (st.avgR >= 0 ? "+" : MINUS) + Math.abs(st.avgR).toFixed(2) + "R" : "–", sparkR(st))}
        </div>
        ${promoHidden ? "<div></div>" : `<a class="promo" href="#rules">
          <button class="x" type="button" id="promo-x" aria-label="Hide for today"><svg width="8" height="8" viewBox="0 0 8 8"><path d="m1 1 6 6M7 1 1 7" stroke="#fff" stroke-width="1.5"/></svg></button>
          <h3>Risk<br>today</h3>
          <p>${money(dayUsed)} of ${money(dayCap, false, 0)} daily stop</p>
          <div class="meter"><span style="width:${Math.min(100, (dayUsed / dayCap) * 100)}%"></span></div>
          <p>${money(totUsed)} of ${money(totCap, false, 0)} account stop</p>
          <div class="meter"><span style="width:${Math.min(100, (totUsed / totCap) * 100)}%"></span></div>
          <svg class="go" width="14" height="14" viewBox="0 0 14 14"><path d="M3 11 11 3M4.5 3H11v6.5" fill="none" stroke="#11142d" stroke-width="1.8"/></svg>
        </a>`}
      </div>`;

    $("#view").querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { S.mode = b.dataset.mode; render(); });
    $("#view").querySelectorAll("[data-range]").forEach((b) => b.onclick = () => { S.range = b.dataset.range; render(); });
    $("#view").querySelectorAll("[data-pair]").forEach((b) => b.onclick = () => {
      const opts = ["equity", "peak", "start"];
      const k = b.dataset.pair === "A" ? "pairA" : "pairB";
      S[k] = opts[(opts.indexOf(S[k]) + 1) % opts.length];
      render();
    });
    $("#swap").onclick = () => { [S.pairA, S.pairB] = [S.pairB, S.pairA]; render(); };
    const x = $("#promo-x");
    if (x) x.onclick = (e) => { e.preventDefault(); try { localStorage.setItem(PROMO, dayKey(S.data.now)); } catch (_) {} render(); };
    drawChart(st);
  }

  const label = (k) => ({ equity: "EQUITY", peak: "PEAK", start: "START" }[k]);

  function statCard(kind, name, small, value, spark) {
    const tint = { winrate: ["#fef3c7", "#b45309", "⬢"], net: ["#ede9fe", "#5b21b6", "$"], count: ["#ffe4e6", "#be123c", "◈"], r: ["#dcfce7", "#15803d", "R"] }[kind];
    return `<div class="stat"><div class="top"><span class="ico" style="background:${tint[0]};color:${tint[1]};font-weight:700">${tint[2]}</span>${spark}</div>
      <div><div class="name">${esc(name)}${small ? `<small>(${esc(small)})</small>` : ""}</div><div class="val">${esc(value)}</div></div></div>`;
  }

  // Sparklines: the same soft line the design uses, coloured by direction.
  function spark(values) {
    if (values.length < 2) values = [0, 0.4, 0.2, 0.6, 0.4, 0.8];
    const w = 118, h = 40, lo = Math.min(...values), hi = Math.max(...values), sp = hi - lo || 1;
    const pts = values.map((v, i) => [i * (w / (values.length - 1)), h - 4 - ((v - lo) / sp) * (h - 8)]);
    const up = values[values.length - 1] >= values[0];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${smooth(pts)}" fill="none" stroke="${up ? "#22c55e" : "#f43f5e"}" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  }
  const lastN = (a, n) => a.slice(Math.max(0, a.length - n));
  function sparkEquity(st) { let r = 0; return spark(lastN(st.closed.map((t) => (r += t.pnl)), 24)); }
  function sparkWin(st) { let w = 0; return spark(lastN(st.closed.map((t, i) => (w += t.pnl > 0 ? 1 : 0) / (i + 1)), 24)); }
  function sparkR(st) { let r = 0; return spark(lastN(st.closed.map((t) => (r += rOf(t))), 24)); }
  function sparkCount(st) {
    const m = new Map(); for (const t of st.closed) m.set(dayKey(t.closed_at), (m.get(dayKey(t.closed_at)) || 0) + 1);
    return spark(lastN([...m.values()], 14));
  }

  function smooth(p) {
    if (!p.length) return "";
    let s = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      s += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return s;
  }

  function drawChart(st) {
    const host = $("#chart");
    const now = S.data.now;
    const span = { "1d": 86400, "3d": 3 * 86400, "1w": 7 * 86400, "1m": 30 * 86400 }[S.range];
    const first = st.closed[0] ? st.closed[0].closed_at - 3600 : now - 30 * 86400;
    const from = span ? now - span : first;
    const base = startBalance();
    // Equity at any time, and its running peak.
    const steps = []; let run = base, peak = base;
    for (const t of st.closed) { run += t.pnl; peak = Math.max(peak, run); steps.push([t.closed_at, run, peak]); }
    const at = (ts) => { let e = base, p = base; for (const s of steps) { if (s[0] > ts) break; e = s[1]; p = s[2]; } return [e, p]; };
    const N = 48, xs = Array.from({ length: N }, (_, i) => from + ((now - from) * i) / (N - 1));
    const series = (k) => xs.map((ts) => { const [e, p] = at(ts); return k === "equity" ? e : k === "peak" ? p : base; });
    const A = series(S.pairA), B = series(S.pairB);
    const W = Math.max(300, host.clientWidth), H = 210, padL = 62, padB = 26;
    const all = A.concat(B), lo0 = Math.min(...all), hi0 = Math.max(...all);
    const pad = Math.max((hi0 - lo0) * 0.15, base * 0.002);
    const lo = lo0 - pad, hi = hi0 + pad;
    const x = (i) => padL + (i / (N - 1)) * (W - padL - 8);
    const y = (v) => 8 + (1 - (v - lo) / (hi - lo)) * (H - 8 - padB);
    const pa = A.map((v, i) => [x(i), y(v)]), pb = B.map((v, i) => [x(i), y(v)]);
    const ticks = 6, yl = Array.from({ length: ticks + 1 }, (_, i) => lo + ((hi - lo) * i) / ticks);
    const months = Array.from({ length: 12 }, (_, i) => xs[Math.round((i * (N - 1)) / 11)]);
    const fmtX = (ts) => span && span <= 86400 ? hhmm(ts) : d(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
      <defs><filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="5"/></filter></defs>
      ${yl.map((v) => `<text class="ax" x="${padL - 12}" y="${y(v) + 3}" text-anchor="end">${money(v, false, 0)}</text>`).join("")}
      ${months.map((ts, i) => i % (W < 600 ? 3 : 1) === 0 ? `<text class="ax" x="${x(Math.round((i * (N - 1)) / 11))}" y="${H - 6}" text-anchor="middle">${fmtX(ts)}</text>` : "").join("")}
      <path d="${smooth(pb)}" fill="none" stroke="var(--pink)" stroke-width="9" opacity=".35" filter="url(#glow)"/>
      <path d="${smooth(pa)}" fill="none" stroke="var(--cyan)" stroke-width="9" opacity=".35" filter="url(#glow)"/>
      <path d="${smooth(pb)}" fill="none" stroke="var(--pink)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      <path d="${smooth(pa)}" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
      <line id="cx" y1="8" y2="${H - padB}" stroke="var(--ink-3)" stroke-dasharray="3 4" visibility="hidden"/>
    </svg><div class="tip" id="tip" hidden></div>`;
    const svg = host.querySelector("svg"), tip = $("#tip"), cx = $("#cx");
    svg.onpointermove = (ev) => {
      const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * W;
      const i = Math.max(0, Math.min(N - 1, Math.round(((px - padL) / (W - padL - 8)) * (N - 1))));
      cx.setAttribute("x1", x(i)); cx.setAttribute("x2", x(i)); cx.setAttribute("visibility", "visible");
      tip.hidden = false; tip.style.left = `${(x(i) / W) * 100}%`; tip.style.top = `${y(A[i])}px`;
      tip.textContent = `${dayName(xs[i])} · ${label(S.pairA).toLowerCase()} ${money(A[i])}`;
    };
    svg.onpointerleave = () => { tip.hidden = true; cx.setAttribute("visibility", "hidden"); };
  }

  function renderTrades() {
    const q = S.q.toLowerCase();
    const rows = scope(S.data.trades).filter((t) => !q || `${t.side} ${t.order_type} ${t.entry} ${t.state} ${t.outcome || ""} ${t.mode}`.toLowerCase().includes(q));
    $("#view").innerHTML = `<div class="view-title"><h2>Trades</h2><span>${rows.length} shown</span></div>
      <div class="table">${rows.length ? `<div class="tr h"><span>When</span><span>Side</span><span>Entry → Exit</span><span class="num">Pips</span><span class="num">P&amp;L</span><span class="num">Result</span></div>` +
        rows.map((t) => {
          const ts = t.closed_at || t.opened_at || t.created_at, closed = t.state === "closed";
          const res = closed ? (t.outcome === "tp" ? "tp" : t.outcome === "sl" ? "sl" : "manual") : t.state;
          const word = { tp: "Target", sl: "Stopped", manual: "Closed", open: "Open", pending: "Waiting", expired: "Expired" }[res];
          return `<div class="tr"><span class="muted">${esc(dayName(ts))}<br>${esc(hhmm(ts))}</span>
            <span class="side-tag ${t.side === "buy" ? "up" : "down"}">${t.side.toUpperCase()}<small>${esc(t.order_type)} · ${t.units} oz · ${esc(t.mode)}</small></span>
            <span>${price(t.entry)} → ${closed ? price(t.exit) : `<span class="muted">SL ${price(t.sl)} · TP ${price(t.tp)}</span>`}${t.note ? `<br><small class="muted">${esc(t.note)}</small>` : ""}</span>
            <span class="num ${closed ? tone(t.pips) : "muted"}">${closed ? (t.pips > 0 ? "+" : "") + t.pips : "–"}</span>
            <span class="num ${closed ? tone(t.pnl) : "muted"}">${closed ? money(t.pnl, true) : "–"}</span>
            <span class="pill ${res}">${word}</span></div>`;
        }).join("") : `<div class="empty"><b>No trades yet</b>Every trade the bot places shows up here.</div>`}</div>`;
  }

  function renderSignals() {
    const q = S.q.toLowerCase();
    const rows = S.data.signals.filter((s) => !q || `${s.side} ${s.status} ${s.reason || ""} ${s.raw || ""}`.toLowerCase().includes(q));
    $("#view").innerHTML = `<div class="view-title"><h2>Signals</h2><span>${rows.length} read</span></div>
      <div class="table">${rows.length ? rows.map((s) => `<div class="sig">
        <span class="muted">${esc(dayName(s.ts))}<br>${esc(hhmm(s.ts))}</span>
        <div class="body">${s.side ? `<b class="${s.side === "buy" ? "up" : "down"}">${s.side.toUpperCase()}${s.order_type && s.order_type !== "market" ? " " + esc(s.order_type.toUpperCase()) : ""}</b> &nbsp;${price(s.entry)} &nbsp;<span class="muted">SL</span> ${price(s.sl)} &nbsp;<span class="muted">TP</span> ${price(s.tp)}` : `<span class="muted">Not read as a signal</span>`}</div>
        <span class="pill ${esc(s.status)}">${esc(s.status)}</span>
        ${s.reason ? `<div class="why">${esc(s.reason)}</div>` : ""}
        ${s.raw ? `<details><summary>Message</summary><pre>${esc(s.raw)}</pre></details>` : ""}
      </div>`).join("") : `<div class="empty"><b>No signals yet</b>Each message the bot reads appears here, with what it did.</div>`}</div>`;
  }

  function renderReports() {
    const st = stats(scope(S.data.trades));
    const days = new Map();
    for (const t of st.closed) {
      const k = dayKey(t.closed_at);
      const r = days.get(k) || { ts: t.closed_at, n: 0, w: 0, pnl: 0, pips: 0 };
      r.n++; r.w += t.pnl > 0 ? 1 : 0; r.pnl += t.pnl; r.pips += t.pips; days.set(k, r);
    }
    const rows = [...days.values()].sort((a, b) => b.ts - a.ts);
    $("#view").innerHTML = `<div class="view-title"><h2>Reports</h2><span>by day</span></div>
      <div class="table">${rows.length ? `<div class="tr h"><span>Day</span><span>Trades</span><span>Won</span><span class="num">Pips</span><span class="num">P&amp;L</span><span class="num">Result</span></div>` +
        rows.map((r) => `<div class="tr"><span>${esc(dayName(r.ts))}</span><span>${r.n}</span><span>${r.w} of ${r.n}</span>
          <span class="num ${tone(r.pips)}">${(r.pips > 0 ? "+" : "") + r.pips.toFixed(0)}</span>
          <span class="num ${tone(r.pnl)}">${money(r.pnl, true)}</span>
          <span class="pill ${r.pnl >= 0 ? "tp" : "sl"}">${r.pnl >= 0 ? "Green" : "Red"}</span></div>`).join("")
        : `<div class="empty"><b>No closed days yet</b>Each trading day gets a line here once a trade closes.</div>`}</div>`;
  }

  function renderBot() {
    const b = S.data.bot;
    const age = b ? Math.max(0, S.data.now - b.ts) : null;
    const items = [
      ["Status", !b ? "Never connected" : age < 180 ? "Listening" : "Silent", b ? `last heard ${ago(age)} ago` : "start the bot to connect"],
      ["Mode", b ? (b.mode === "live" ? "Live orders" : "Paper") : "–", b && b.account ? (b.account.demo ? "demo account" : "real account") : ""],
      ["Channel", b && b.source ? String(b.source) : "–", "Telegram source"],
      ["Copying", S.data.control && S.data.control.paused ? "Paused" : "Active", "toggle from the right panel"],
    ];
    $("#view").innerHTML = `<div class="view-title"><h2>Bot</h2><span>health</span></div>
      <div class="kv">${items.map(([k, v, s]) => `<div class="item"><span>${k}</span><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join("")}</div>`;
  }

  function renderRules() {
    const r = (S.data.bot && S.data.bot.rules) || {};
    const items = [
      ["Risk per trade", r.risk_usd ? money(r.risk_usd) : "–", "fixed, sized from the stop distance"],
      ["Daily stop", r.daily_stop_usd ? money(r.daily_stop_usd, false, 0) : "–", "no new trade past this loss today"],
      ["Account stop", r.total_stop_usd ? money(r.total_stop_usd, false, 0) : "–", "no new trade past this drawdown"],
      ["Break-even", r.be_at_r ? `at ${r.be_at_r}R` : "–", r.be_plus_usd ? `stop moves to entry + $${r.be_plus_usd}` : ""],
      ["Open at once", r.max_open ? String(r.max_open) : "–", "positions and pending orders"],
      ["Trades a day", r.max_trades_day ? String(r.max_trades_day) : "no limit",
        `${(S.data.bot && S.data.bot.account && S.data.bot.account.trades_today) || 0} placed today, none past the limit`],
      ["Pending orders", "4 hours", "a stop or limit that never fills expires"],
    ];
    $("#view").innerHTML = `<div class="view-title"><h2>Rules</h2><span>as the bot reports them</span></div>
      <div class="kv">${items.map(([k, v, s]) => `<div class="item"><span>${k}</span><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join("")}</div>`;
  }

  function renderAccount() {
    const a = S.data.bot && S.data.bot.account;
    const items = a ? [
      ["Balance", money(Number(a.balance)), `started at ${money(Number(a.start), false, 0)}`],
      ["Equity", money(Number(a.equity ?? a.balance)), "balance plus open trades"],
      ["Lost today", money(Number(a.day_loss || 0)), "closed and floating"],
      ["Below start", money(Number(a.total_loss || 0)), "what the firm measures"],
      ["Open risk", money(Number(a.open_risk || 0)), `${a.open_count || 0} open or waiting`],
      ["Login", `${a.login}`, `${a.server}${a.demo ? " · demo" : ""}`],
    ] : [["Account", "Not connected", "appears once the bot runs on MT5"]];
    $("#view").innerHTML = `<div class="view-title"><h2>Account</h2><span>${a ? (a.demo ? "demo" : "live") : ""}</span></div>
      <div class="kv">${items.map(([k, v, s]) => `<div class="item"><span>${k}</span><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join("")}</div>`;
  }

  /* ---------- right panel and status ---------- */
  function renderSide() {
    const data = S.data, b = data.bot, a = b && b.account;
    const age = b ? Math.max(0, data.now - b.ts) : null;
    const live = b && age < 180;
    $("#status-badge").classList.toggle("off", !live);
    $("#status-title").textContent = !b ? "Bot offline" : live ? (b.mode === "live" ? "MT5 connected" : "Paper mode") : "Bot silent";
    $("#status-sub").textContent = !b ? "start it to connect" : live ? `listening · ${ago(age)} ago` : `last heard ${ago(age)} ago`;
    $("#acct-login").textContent = a ? String(a.login).slice(-4) : "0000";
    $("#acct-firm").textContent = (a && (a.firm || (a.server || "").split(/[-.]/)[0]) || "FUNDINGPIPS").toUpperCase();
    $("#acct-name").textContent = a && a.name ? a.name : "Trading account";
    $("#acct-size").textContent = a && a.start ? `${Math.round(Number(a.start) / 1000)}K` : "5K";
    const last = data.signals.find((s) => s.side === S.side);
    $("#f2-label").textContent = `Last ${S.side} entry`;
    $("#f2-val").textContent = last ? price(last.entry) : "–";
    const r = last && last.entry != null && last.sl != null && last.tp != null && last.entry !== last.sl
      ? (Math.abs(last.tp - last.entry) / Math.abs(last.entry - last.sl)).toFixed(1) : null;
    $("#f3-val").textContent = last ? `${price(last.sl)} / ${price(last.tp)}` : "–";
    $("#f3-unit").textContent = r ? `1:${r}` : "R";
    document.querySelectorAll("[data-side]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.side === S.side)));
    const paused = data.control && data.control.paused;
    const btn = $("#pause");
    btn.textContent = paused ? "Resume copying" : "Pause copying";
    btn.classList.toggle("paused", Boolean(paused));
    $("#pause-note").textContent = paused ? "Paused: signals are recorded, nothing is placed" : (live ? "Copying every signal" : "");
    $("#bell-dot").hidden = !data.signals.some((s) => data.now - s.ts < 3600);
  }

  document.querySelectorAll("[data-side]").forEach((x) => x.onclick = () => { S.side = x.dataset.side; renderSide(); });
  document.querySelectorAll("[data-go]").forEach((x) => x.onclick = () => { location.hash = x.dataset.go; });
  $("#pause").onclick = async () => {
    const want = !(S.data.control && S.data.control.paused);
    if (DEMO) { S.data.control = { paused: want }; renderSide(); return; }
    let key = ""; try { key = localStorage.getItem(KEY) || ""; } catch (_) {}
    $("#pause-note").textContent = "Sending…";
    const r = await fetch("/api/control", { method: "POST", headers: { authorization: `Bearer ${key}`, "content-type": "application/json" }, body: JSON.stringify({ paused: want }) });
    if (r.ok) { S.data.control = await r.json(); renderSide(); $("#pause-note").textContent = want ? "Paused. The bot picks this up within 30 seconds" : "Resumed. The bot picks this up within 30 seconds"; }
    else $("#pause-note").textContent = "Could not reach the desk";
  };
  $("#search").addEventListener("input", (e) => {
    S.q = e.target.value.trim();
    if (S.view !== "trades" && S.view !== "signals") location.hash = "trades"; else render();
  });

  /* ---------- routing ---------- */
  const VIEWS = { dashboard: renderDashboard, trades: renderTrades, signals: renderSignals, reports: renderReports, bot: renderBot, rules: renderRules, account: renderAccount };
  function render() {
    const v = (location.hash || "#dashboard").slice(1);
    S.view = VIEWS[v] ? v : "dashboard";
    $("#title").textContent = NAV.find(([k]) => k === S.view)[1];
    document.querySelectorAll("[data-k]").forEach((a) => {
      if (a.dataset.k === S.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    VIEWS[S.view]();
    renderSide();
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => S.data && S.view === "dashboard" && drawChart(stats(scope(S.data.trades))), 120); });

  /* ---------- lock and refresh ---------- */
  function showLock(msg = "") {
    $("#app").hidden = true; $("#lock").hidden = false;
    $("#lock-err").textContent = msg;
    setTimeout(() => $("#key").focus(), 50);
  }
  $("#lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = $("#key").value.trim(); if (!v) return;
    try { localStorage.setItem(KEY, v); } catch (_) {}
    await start();
  });
  async function refresh() {
    try {
      const data = await load();
      if (!data) return false;
      S.data = data; render(); return true;
    } catch (_) {
      $("#status-title").textContent = "Desk unreachable"; $("#status-sub").textContent = "retrying";
      return Boolean(S.data);
    }
  }
  async function start() {
    const ok = await refresh();
    if (!ok) { if ($("#app").hidden && !$("#lock-err").textContent) showLock(); return; }
    $("#lock").hidden = true; $("#app").hidden = false; $("#demo-flag").hidden = !DEMO;
    render();
    clearInterval(S.timer);
    if (!DEMO) S.timer = setInterval(() => { if (!document.hidden) refresh(); }, 10000);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.data && !DEMO) refresh(); });

  /* ---------- demo ---------- */
  function demoData() {
    let seed = 20261015;
    const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const now = Math.floor(Date.now() / 1000);
    let px = 4120, id = 0; const signals = [], trades = [];
    for (let day = 40; day >= 0; day--) {
      const base = now - day * 86400, wd = d(base).getDay();
      if (wd === 0 || wd === 6) continue;
      for (let i = 0, n = Math.floor(rnd() * 5); i < n; i++) {
        id++;
        const ts = base - Math.floor(rnd() * 30000) - 3600;
        if (ts > now - 600) continue;
        px += (rnd() - 0.47) * 18;
        const side = rnd() > 0.5 ? "buy" : "sell", order = rnd() > 0.55 ? "stop" : "market";
        const risk = 4 + rnd() * 6, reward = risk * (2 + rnd() * 3.5);
        const entry = +px.toFixed(2), sl = +(side === "buy" ? entry - risk : entry + risk).toFixed(2), tp = +(side === "buy" ? entry + reward : entry - reward).toFixed(2);
        const raw = `\u{1F4B8}XAUUSD${side === "buy" ? "⬆️" : "⬇️"} [1m]\n\n${side === "buy" ? "\u{1F7E2}Buy" : "\u{1F534}Sell"}${order === "stop" ? " Stop" : ""} : ${entry}\n\u{1F3AF}Take Profit : ${tp}\n\u{1F6AB}Stop Loss : ${sl}`;
        signals.push({ id, ts, side, order_type: order, entry, sl, tp, status: "taken", reason: "$25.00 risk", raw });
        const units = Math.max(1, Math.floor(25 / risk));
        const t = { id, mode: "live", side, order_type: order, units, entry, sl, tp, created_at: ts, opened_at: ts + 60, note: null };
        if (day === 0 && i === n - 1) { trades.push({ ...t, state: "open" }); continue; }
        const roll = rnd();
        const out = roll < 0.42 ? "tp" : roll < 0.6 ? "be" : "sl";
        const exit = out === "tp" ? tp : out === "be" ? (side === "buy" ? entry + 1 : entry - 1) : sl;
        const move = side === "buy" ? exit - entry : entry - exit;
        trades.push({ ...t, state: "closed", outcome: out === "be" ? "manual" : out, exit, closed_at: ts + 900 + Math.floor(rnd() * 9000),
          pips: +(move / 0.1).toFixed(1), pnl: +(move * units).toFixed(2), note: out === "be" ? "stop moved to break-even +$1" : null });
      }
    }
    signals.sort((a, b) => b.ts - a.ts); trades.sort((a, b) => b.created_at - a.created_at);
    const net = trades.filter((t) => t.state === "closed").reduce((a, t) => a + t.pnl, 0);
    return { now, control: { paused: false }, signals, trades, bot: { mode: "live", ts: now - 12, source: "TradeX Signals",
      rules: { risk_usd: 25, daily_stop_usd: 125, total_stop_usd: 450, max_open: 2, max_trades_day: 5, be_at_r: 1.5, be_plus_usd: 1 },
      account: { balance: 5000 + net, equity: 5000 + net + 6.4, day_loss: 18.5, total_loss: 0, open_risk: 22.4, open_count: 1, start: 5000, login: "10013146207", server: "FundingPips-Server", demo: false, name: "Yarin N.", firm: "FundingPips" } } };
  }

  start();
})();
</script>
</body>
