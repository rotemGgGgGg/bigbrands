<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מוצר — BIG BRANDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Secular+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">דלג לתוכן הראשי</a>
  <header class="header" id="header">
    <div class="container">
      <a class="logo" href="index.html" aria-label="BIG BRANDS">
        <img src="assets/logo.png" alt="BIG BRANDS" class="logo-img" />
      </a>
      <form class="search" role="search" onsubmit="return false;">
        <div class="dd" id="catDropdown">
          <button type="button" class="dd-toggle" id="catToggle" aria-haspopup="listbox" aria-expanded="false">
            <span id="catLabel">הכל</span>
            <svg class="dd-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="dd-menu" id="catMenu" role="listbox" tabindex="-1"></ul>
        </div>
        <input type="search" placeholder="חפש מוצרים…" aria-label="חיפוש מוצרים" />
        <button class="go" aria-label="חפש">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        </button>
      </form>
      <div class="actions">
        <button class="icon-btn" id="themeToggle" aria-label="מצב כהה/בהיר" title="מצב כהה/בהיר">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
        </button>
        <button class="icon-btn" aria-label="עגלה" id="cartBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.4 12.2a1.5 1.5 0 0 0 1.5 1.2h8.5a1.5 1.5 0 0 0 1.5-1.2L22 7H6"/></svg>
          <span class="count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="nav">
    <div class="container">
      <a class="all" href="products.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        כל המוצרים
      </a>
      <ul id="navList"></ul>
    </div>
  </nav>

  <main class="container" id="main">
    <div id="pdp"></div>
  </main>

  <footer class="footer">
    <div class="legal" style="border-top:0">
      <div class="container">
        <div class="bottom">
          <span>© <span id="year"></span> ביג ברנדס בע"מ — כל הזכויות שמורות.</span>
          <span><a href="index.html">חזרה לדף הבית</a></span>
        </div>
      </div>
    </div>
  </footer>

  <a class="fab" href="https://wa.me/972508808076" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.2 1.1-1.7 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .5l-.4.5c-.1.2-.3.3-.1.6.1.3.6 1 1.3 1.6.9.8 1.6 1 1.9 1.2.2.1.4.1.5-.1l.6-.7c.2-.2.3-.2.6-.1l1.8.9c.3.1.4.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
  </a>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/product-page.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
