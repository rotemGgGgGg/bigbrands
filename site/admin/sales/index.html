<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Overview — BIG BRANDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: #303030; background: #ebebeb; }
  .display { font-family: "Bricolage Grotesque", Inter, sans-serif; }
  .topbar { height: 56px; background: #1a1a1a; display: flex; align-items: center; padding: 0 20px; }
  .brand { color: #fff; font-weight: 800; font-size: 19px; letter-spacing: .02em; }

  main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 56px; }
  .welcome { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; }
  .muted { color: #616161; }
  .head { margin-bottom: 16px; }

  .btn { height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: #fff; font: 600 13px Inter; color: #303030; cursor: pointer;
    box-shadow: 0 0 0 1px #d4d4d4 inset, 0 1px 0 #b5b5b5; }
  .btn.dark { background: #303030; color: #fff; box-shadow: 0 1px 0 #000, inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .btn.ghost { background: none; box-shadow: none; color: #8e1f0b; }

  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 0 rgba(26,26,26,.07), 0 0 0 1px rgba(0,0,0,.04); padding: 16px; min-width: 0; }
  .label { font-weight: 650; display: inline-block; border-bottom: 2px dotted #c4c4c4; padding-bottom: 1px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 12px; }
  .kpi .v { font-size: 22px; font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi .s { color: #616161; font-size: 12px; margin-top: 2px; }

  .grid { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 12px; }
  .big { font-size: 28px; font-weight: 700; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  svg text { font: 12px Inter; fill: #616161; }
  .row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f1f1f1; }
  .row:last-child { border: 0; font-weight: 700; }
  .row span:last-child { font-variant-numeric: tabular-nums; }

  form.add { display: grid; grid-template-columns: 1.3fr 1.5fr 1fr 1fr 1fr auto; gap: 8px; margin-top: 12px; align-items: end; }
  form.add label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #616161; font-weight: 500; }
  form.add input, form.add select { height: 34px; border: 1px solid #c9c9c9; border-radius: 8px; padding: 0 10px; font: 13px Inter; color: #303030; background: #fdfdfd; min-width: 0; }
  form.add input:focus, form.add select:focus { outline: 2px solid #005bd3; outline-offset: -1px; }

  .tabs { display: inline-flex; gap: 4px; margin: 16px 0 6px; }
  .tab { height: 28px; padding: 0 12px; border-radius: 8px; border: 0; background: none; font: 600 12px Inter; color: #616161; cursor: pointer; }
  .tab.on { background: #f1f1f1; color: #303030; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f1f1f1; white-space: nowrap; }
  th { font-size: 12px; color: #616161; font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 8px; }
  .badge.ok { background: #cdfee1; color: #0c5132; }
  .badge.wip { background: #ffeb78; color: #4f4700; }
  .tablewrap { overflow-x: auto; }
  .empty { text-align: center; color: #616161; padding: 28px 8px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: minmax(0,1fr); }
    .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
    form.add { grid-template-columns: 1fr 1fr; }
    form.add button { grid-column: 1 / -1; }
    .welcome { font-size: 24px; }
  }
</style>
</head>
<body>
<header class="topbar"><span class="brand display">BIG BRANDS</span></header>

<main>
  <div class="head">
    <div class="welcome display">Welcome Mr. Roey</div>
    <div class="muted">Overview · last 12 months</div>
  </div>

  <div class="kpis">
    <div class="card kpi"><span class="label">Gross sales</span><div class="v" id="kGross"></div><div class="s">Approved deals</div></div>
    <div class="card kpi"><span class="label">In progress</span><div class="v" id="kWip"></div><div class="s" id="kWipN"></div></div>
    <div class="card kpi"><span class="label">Orders</span><div class="v" id="kOrders"></div><div class="s">Approved</div></div>
    <div class="card kpi"><span class="label">Average order value</span><div class="v" id="kAov"></div><div class="s">Approved deals</div></div>
  </div>

  <div class="grid">
    <section class="card">
      <span class="label">Total sales over time</span>
      <div class="big" id="total"></div>
      <svg id="chart" viewBox="0 0 760 280" width="100%"></svg>
    </section>
    <section class="card">
      <span class="label">Total sales breakdown</span>
      <div id="breakdown" style="margin-top:8px"></div>
    </section>
  </div>

  <section class="card" style="margin-top:12px">
    <span class="label">Deals</span>
    <form class="add" id="add">
      <label>Customer<input name="customer" required placeholder="Name / company" /></label>
      <label>Product<input name="product" list="products" placeholder="What was sold" /></label>
      <label>Amount (₪)<input name="amount" type="number" min="0" step="1" required /></label>
      <label>Date<input name="date" type="date" required /></label>
      <label>Status<select name="status"><option value="approved">Approved</option><option value="wip">In progress</option></select></label>
      <button class="btn dark" style="height:34px">Add deal</button>
    </form>
    <datalist id="products"></datalist>

    <div class="tabs">
      <button class="tab on" data-f="all">All</button>
      <button class="tab" data-f="approved">Approved</button>
      <button class="tab" data-f="wip">In progress</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<script src="/js/data.js"></script>
<script>
const KEY = "bb.sales.deals";
const VAT = 0.18;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ils = (n, d = 0) => "₪" + Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch { alert("Could not save in this browser"); } };
let deals = load(), filter = "all";

$("#add").date.value = new Date().toISOString().slice(0, 10);
try { $("#products").innerHTML = (window.SITE_DATA?.products || []).map((p) => `<option value="${esc(p.name)}">`).join(""); } catch {}

$("#add").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  deals.push({ id: Date.now().toString(36), customer: f.customer.value.trim(), product: f.product.value.trim(),
    amount: Math.max(0, Number(f.amount.value) || 0), date: f.date.value, status: f.status.value });
  save(deals);
  f.customer.value = f.product.value = f.amount.value = "";
  f.customer.focus();
  render();
});

document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  filter = t.dataset.f;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  render();
});

$("#rows").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const d = deals.find((x) => x.id === b.dataset.id); if (!d) return;
  if (b.dataset.act === "approve") d.status = "approved";
  if (b.dataset.act === "delete" && confirm(`Delete the deal with ${d.customer}?`)) deals = deals.filter((x) => x !== d);
  save(deals); render();
});

function months() {
  const out = [], now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    out.push({ key, label: d.toLocaleString("en-US", { month: "short" }), v: 0 });
  }
  return out;
}

function render() {
  const ok = deals.filter((d) => d.status === "approved"), wip = deals.filter((d) => d.status === "wip");
  const gross = ok.reduce((s, d) => s + d.amount, 0), wipSum = wip.reduce((s, d) => s + d.amount, 0);
  const net = gross / (1 + VAT);
  $("#kGross").textContent = ils(gross);
  $("#kWip").textContent = ils(wipSum);
  $("#kWipN").textContent = `${wip.length} open deal${wip.length === 1 ? "" : "s"}`;
  $("#kOrders").textContent = ok.length;
  $("#kAov").textContent = ils(ok.length ? gross / ok.length : 0);
  $("#total").textContent = ils(gross, 2);
  $("#breakdown").innerHTML = [["Gross sales", gross], ["Net sales (excl. VAT)", net], ["Taxes (VAT 18%)", gross - net], ["In progress", wipSum], ["Total sales", gross]]
    .map(([l, v]) => `<div class="row"><span>${l}</span><span>${ils(v, 2)}</span></div>`).join("");

  const ms = months();
  ok.forEach((d) => { const m = ms.find((x) => x.key === (d.date || "").slice(0, 7)); if (m) m.v += d.amount; });
  const W = 760, H = 280, L = 52, R = 8, T = 12, B = 30;
  const max = Math.max(1000, ...ms.map((m) => m.v)) * 1.15;
  const x = (i) => L + i * ((W - L - R) / (ms.length - 1)), y = (v) => T + (1 - v / max) * (H - T - B);
  const line = ms.reduce((p, m, i) => i ? p + ` C${(x(i - 1) + x(i)) / 2},${y(ms[i - 1].v)} ${(x(i - 1) + x(i)) / 2},${y(m.v)} ${x(i)},${y(m.v)}` : `M${x(0)},${y(m.v)}`, "");
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = (max / 4) * k; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#f1f1f1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">₪${v >= 1000 ? Math.round(v / 1000) + "K" : Math.round(v)}</text>`; }
  ms.forEach((m, i) => { if (i % 2 === 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${m.label}</text>`; });
  $("#chart").innerHTML = `<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b9fd9" stop-opacity=".14"/><stop offset="1" stop-color="#2b9fd9" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${line} L${x(ms.length - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#fill)"/><path d="${line}" fill="none" stroke="#2b9fd9" stroke-width="3" stroke-linecap="round"/>`;

  const list = deals.filter((d) => filter === "all" || d.status === filter).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  $("#rows").innerHTML = list.length ? list.map((d) => `<tr>
      <td>${esc(d.date)}</td><td>${esc(d.customer)}</td><td>${esc(d.product || "—")}</td><td class="num">${ils(d.amount)}</td>
      <td><span class="badge ${d.status === "approved" ? "ok" : "wip"}">${d.status === "approved" ? "Approved" : "In progress"}</span></td>
      <td style="text-align:right">${d.status === "wip" ? `<button class="btn sm" data-act="approve" data-id="${d.id}">Mark approved</button>` : ""}
        <button class="btn sm ghost" data-act="delete" data-id="${d.id}">Delete</button></td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">No deals yet. Add your first one above.</td></tr>`;
}
render();
</script>
</body>
</html>
