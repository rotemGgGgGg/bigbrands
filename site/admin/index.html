<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>ניהול — BIG BRANDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* FROST recipe: frosted panes over a sculpted grey SVG background */
  :root {
    --ink: #15181e; --ink-2: #4d5563; --ink-3: #848b98;
    --bg: #e4e7ec;
    --accent: #3a6ff0; --accent-soft: rgba(58,111,240,.12);
    --up: #12996b; --down: #e0365a;
    --lift: 0 1px 0 rgba(255,255,255,.85) inset, 0 -1px 0 rgba(255,255,255,.25) inset, 0 24px 50px -24px rgba(40,50,70,.35), 0 2px 6px -2px rgba(40,50,70,.08);
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Geist", system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg);
    overflow-x: hidden; padding: max(28px, env(safe-area-inset-top)) 16px 48px;
  }
  .frost-bg { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
  .frost-bg svg { width: 100%; height: 100%; display: block; }

  .glass {
    background: rgba(255,255,255,.34);
    -webkit-backdrop-filter: blur(30px) saturate(140%); backdrop-filter: blur(30px) saturate(140%);
    border: 1px solid rgba(255,255,255,.6); border-radius: 22px; box-shadow: var(--lift);
  }
  .glass-selected {
    background: rgba(255,255,255,.78);
    box-shadow: 0 1px 0 #fff inset, 0 6px 16px -8px rgba(40,50,70,.35), 0 0 0 1px rgba(20,26,38,.06);
  }

  .stage { position: relative; max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; }
  .card-back { grid-column: 1; grid-row: 1; margin-top: 46px; margin-inline-end: -60px; padding: 22px 22px 18px 80px; min-height: 520px; }
  .card-front { grid-column: 2; grid-row: 1; padding: 22px; z-index: 2; min-height: 560px; }
  .card-front, .card-back, .item, .list { min-width: 0; }

  .top { display: flex; align-items: center; gap: 10px; }
  .ava-logo { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); flex: none; }
  .ava-logo img { width: 30px; }
  .addr { font-weight: 600; font-size: 15px; }
  .copy { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.6); }
  .spacer { flex: 1; }
  .round { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); text-decoration: none;
    background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.65); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); transition: background .15s; }
  .round:hover { background: rgba(255,255,255,.7); color: var(--ink); }

  .big { font-size: 40px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 22px 0 2px; }
  .sub { color: var(--ink-3); font-size: 14px; min-height: 20px; }
  .sub a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .model { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; unicode-bidi: plaintext; text-align: right; }

  .search { display: flex; gap: 8px; margin: 18px 0 12px; padding: 5px; border-radius: 18px; background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.6); }
  .search:focus-within { border-color: rgba(58,111,240,.4); }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 12px; border: 0; outline: none; background: transparent; color: var(--ink); }
  .search input::placeholder { color: var(--ink-3); }
  .cta { flex: none; width: 44px; border: 0; border-radius: 14px; cursor: pointer; display: grid; place-items: center; color: #fff;
    background: linear-gradient(180deg, #3b404b, #1d2129); box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 14px 30px -14px rgba(20,26,38,.6); }
  .cta:hover { box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 18px 36px -14px rgba(20,26,38,.7); }

  .tabs { display: inline-flex; gap: 2px; flex-wrap: wrap; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.6); }
  .pill { padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--ink-2); cursor: pointer; border: 0; background: none; font-family: inherit; user-select: none; }
  .pill[aria-pressed="true"], .pill:has(input:checked) {
    background: rgba(255,255,255,.78); color: var(--ink); font-weight: 600;
    box-shadow: 0 1px 0 #fff inset, 0 6px 16px -8px rgba(40,50,70,.35), 0 0 0 1px rgba(20,26,38,.06);
  }
  .pill input { display: none; }
  .srcs { margin-top: 8px; }
  .srcs .pill { font-size: 12px; padding: 5px 11px; }

  .section { color: var(--ink-3); font-size: 12px; font-weight: 600; margin: 18px 4px 6px; }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; text-decoration: none; color: inherit;
    border-bottom: 1px solid rgba(255,255,255,.45); transition: background .15s, box-shadow .15s; }
  .item:last-child { border-bottom-color: transparent; }
  .item:hover { background: rgba(255,255,255,.5); box-shadow: 0 1px 0 #fff inset, 0 8px 20px -14px rgba(40,50,70,.4); }
  .ico { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 13px;
    background: rgba(124,138,165,.18); color: #5b6782; }
  .ico.a { background: rgba(58,111,240,.14); color: var(--accent); }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta small { display: block; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; text-align: right; }
  .val { text-align: left; flex: none; }
  .val b { display: block; font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .val small { display: block; color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .tag { font-size: 10px; font-weight: 600; padding: 1px 7px; margin-inline-start: 6px; border-radius: 6px; vertical-align: 1px; }
  .tag.exact { background: var(--accent-soft); color: var(--accent); }
  .tag.similar { background: rgba(124,138,165,.14); color: #5b6782; }
  .tag.used { background: rgba(194,122,14,.12); color: #9a5f0b; }
  .empty { color: var(--ink-3); font-size: 14px; padding: 30px 8px; text-align: center; }
  .status { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .status span { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.55); color: var(--ink-3); }
  .status span.err { color: var(--down); }
  .filter { width: 100%; font: inherit; font-size: 13px; padding: 9px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.4); outline: none; margin-top: 12px; color: var(--ink); }
  .filter:focus { border-color: rgba(58,111,240,.4); }
  .note { color: var(--ink-3); font-size: 11.5px; margin: 14px 4px 0; }
  .recent .item { cursor: pointer; }
  .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  @media (max-width: 820px) {
    .stage { grid-template-columns: minmax(0, 1fr); max-width: 460px; }
    .card-back { display: none; }
    .card-front { grid-column: 1; min-height: 0; }
    .big { font-size: 34px; }
    .val small { max-width: 110px; }
  }
</style>
</head>
<body>
<div class="frost-bg" aria-hidden="true"><svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef0f4"/><stop offset="1" stop-color="#d7dbe2"/></linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e6e9ee"/><stop offset="1" stop-color="#bfc5cf"/></linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7f8fa"/><stop offset=".6" stop-color="#d9dde4"/><stop offset="1" stop-color="#b8bfca"/></linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1800" height="1800"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="shade" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1800" height="1800"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#fb)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-120 210 C 120 60, 260 360, 470 230 S 820 40, 1120 220" stroke="#9aa3b2" stroke-opacity=".5" stroke-width="170" filter="url(#shade)" transform="translate(0 40)"/>
    <path d="M-120 210 C 120 60, 260 360, 470 230 S 820 40, 1120 220" stroke="url(#r1)" stroke-width="160" filter="url(#soft)"/>
    <path d="M-160 520 C 90 380, 330 700, 560 520 S 900 330, 1160 560" stroke="#8f99a9" stroke-opacity=".48" stroke-width="190" filter="url(#shade)" transform="translate(0 46)"/>
    <path d="M-160 520 C 90 380, 330 700, 560 520 S 900 330, 1160 560" stroke="url(#r2)" stroke-width="180" filter="url(#soft)"/>
    <path d="M-140 860 C 140 720, 380 1010, 620 850 S 960 700, 1180 880" stroke="#8f99a9" stroke-opacity=".46" stroke-width="180" filter="url(#shade)" transform="translate(0 44)"/>
    <path d="M-140 860 C 140 720, 380 1010, 620 850 S 960 700, 1180 880" stroke="url(#r1)" stroke-width="170" filter="url(#soft)"/>
    <path d="M300 -80 C 380 120, 240 300, 360 480" stroke="#ffffff" stroke-opacity=".55" stroke-width="60" filter="url(#shade)"/>
  </g>
</svg></div>

<div class="stage">
  <aside class="glass card-back recent">
    <div class="top">
      <div class="ava-logo"><img src="/assets/logo.png" alt="" /></div>
      <span class="addr">היסטוריה</span>
    </div>
    <div class="big" id="lastBest">—</div>
    <div class="sub" id="lastQ">החיפוש האחרון</div>
    <div class="section">חיפושים אחרונים</div>
    <div class="list" id="recent"><div class="empty">עדיין אין חיפושים</div></div>
  </aside>

  <main class="glass card-front">
    <div class="top">
      <div class="ava-logo"><img src="/assets/logo.png" alt="" /></div>
      <span class="addr">BIG BRANDS</span>
      <a class="copy" href="/admin/products.html" title="ניהול מוצרים" aria-label="ניהול מוצרים">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
      </a>
      <span class="spacer"></span>
      <a class="round" href="/" title="לאתר" aria-label="לאתר">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 11 12 3l9 8M5 10v10h14V10"/></svg>
      </a>
      <a class="round" href="/admin/logout" title="יציאה" aria-label="יציאה">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
      </a>
    </div>

    <div class="big" id="best">₪0</div>
    <div class="sub" id="bestSub">הכי מדויק: חיפוש לפי מק״ט, למשל DN6M7ET</div>
    <div class="model" id="model"></div>

    <form class="search" id="f">
      <input id="q" list="catalog" placeholder="מק״ט או שם דגם מלא…" autocomplete="off" required />
      <datalist id="catalog"></datalist>
      <button class="cta" id="go" aria-label="חפש">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      </button>
    </form>

    <div class="tabs" id="tabs">
      <button class="pill" data-tab="all" aria-pressed="true">כל ההצעות</button>
      <button class="pill" data-tab="IL" aria-pressed="false">ישראל</button>
      <button class="pill" data-tab="abroad" aria-pressed="false">חו״ל</button>
    </div>
    <div class="srcs">
      <div class="tabs" id="srcs">
        <label class="pill"><input type="checkbox" value="serper" checked />Google</label>
        <label class="pill"><input type="checkbox" value="zap" checked />זאפ</label>
        <label class="pill"><input type="checkbox" value="ivory" checked />Ivory</label>
        <label class="pill"><input type="checkbox" value="aliexpress" />AliExpress</label>
      </div>
    </div>

    <div id="results"></div>
  </main>
</div>

<script src="/js/data.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ils = (n) => n == null ? "—" : "₪" + Number(n).toLocaleString("he-IL");
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : "#";
const SRC = { Google: "Google", Zap: "זאפ", Ivory: "Ivory", AliExpress: "AliExpress", eBay: "eBay" };
const STATUS = { serper: "Google", zap: "זאפ", ivory: "Ivory", aliexpress: "AliExpress", ebay: "eBay" };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>';
let data = null, tab = "all", filterText = "";

try {
  $("#catalog").innerHTML = (window.SITE_DATA?.products || [])
    .map((p) => `<option value="${esc(p.mpn || p.name)}">${esc(p.name)}</option>`).join("");
} catch {}

const savedSrc = store.get("bb.admin.sources.v3", null);
if (savedSrc) document.querySelectorAll("#srcs input").forEach((i) => (i.checked = savedSrc.includes(i.value)));

document.querySelectorAll("#tabs .pill").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs .pill").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  if (data) renderList();
});

$("#f").addEventListener("submit", (e) => { e.preventDefault(); run($("#q").value); });

async function run(query) {
  query = query.trim();
  if (!query) return;
  $("#q").value = query;
  const sources = [...document.querySelectorAll("#srcs input:checked")].map((i) => i.value);
  if (!sources.length) return alert("בחר לפחות מקור אחד");
  store.set("bb.admin.sources.v3", sources);
  $("#go").innerHTML = '<span class="spin"></span>'; $("#go").disabled = true;
  $("#results").innerHTML = ""; $("#model").textContent = "";
  filterText = "";
  try {
    const r = await fetch(`/api/prices?q=${encodeURIComponent(query)}&sources=${sources.join(",")}`, { credentials: "same-origin" });
    if (r.status === 401) { location.reload(); return; }
    data = await r.json();
    if (data.error) throw new Error(data.error);
    saveRecent(query, data.items[0]?.totalILS);
    renderAll();
  } catch (err) {
    $("#results").innerHTML = `<div class="empty">שגיאה: ${esc(err.message)}</div>`;
  } finally {
    $("#go").disabled = false; $("#go").innerHTML = SEARCH_ICON;
  }
}

function renderAll() {
  const best = data.items[0];
  $("#best").textContent = best ? ils(best.totalILS) : "אין תוצאות";
  $("#bestSub").innerHTML = best
    ? `~ ${esc(best.store)}${best.match === "similar" ? " · דגם דומה" : ""} · <a href="${esc(safeUrl(best.url))}" target="_blank" rel="noopener noreferrer">לעסקה ←</a>`
    : (data.mpnMode ? "המק״ט לא נמצא בזאפ. נסה שם דגם מלא." : "נסה מק״ט או שם דגם מלא");
  $("#model").textContent = data.model ? "דגם: " + data.model : "";
  renderList();
}

function row(i) {
  const abroad = i.region !== "IL";
  const used = /מחודש|משומש|יד שני|refurb|renewed|used|open box/i.test(i.title);
  const tags = (i.match === "exact" ? '<span class="tag exact">מק״ט תואם</span>' : i.match === "similar" ? '<span class="tag similar">דגם דומה</span>' : "")
    + (used ? '<span class="tag used">מחודש</span>' : "");
  const sub = [SRC[i.source] || i.source, i.shippingILS === 0 ? "משלוח חינם" : i.shippingILS ? "משלוח " + ils(i.shippingILS) : "", i.delivery, abroad && i.vatILS ? "כולל מע״מ" : ""].filter(Boolean).join(" · ");
  return `<a class="item" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer" title="${esc(i.title)}">
    <span class="ico${i.match === "exact" ? " a" : ""}">${esc((i.store || "?").trim().charAt(0).toUpperCase())}</span>
    <span class="meta"><b>${esc(i.store)}${tags}</b><small>${esc(i.title)}</small></span>
    <span class="val"><b>${ils(i.totalILS)}</b><small>${esc(sub)}</small></span>
  </a>`;
}

function renderList() {
  let items = data.items.filter((i) => tab === "all" || (tab === "IL" ? i.region === "IL" : i.region !== "IL"));
  if (filterText) items = items.filter((i) => (i.title + " " + i.store).toLowerCase().includes(filterText));
  const status = Object.entries(data.status).map(([k, v]) =>
    v.ok ? `<span>${STATUS[k] || k} ${v.count}</span>` : `<span class="err">${STATUS[k] || k}: ${esc(v.error)}</span>`).join("");
  const exact = items.filter((i) => i.match !== "similar"), similar = items.filter((i) => i.match === "similar");
  $("#results").innerHTML = `
    <div class="status">${status}</div>
    ${data.items.length ? `<input class="filter" id="tf" placeholder="סינון בתוצאות…" value="${esc(filterText)}" />` : ""}
    ${items.length ? `
      ${exact.length ? `<div class="section">${data.mpnMode ? "מק״ט תואם" : "הכי זולים"} · ${exact.length}</div><div class="list">${exact.map(row).join("")}</div>` : ""}
      ${similar.length ? `<div class="section">דגם דומה, תצורה לא מאומתת · ${similar.length}</div><div class="list">${similar.map(row).join("")}</div>` : ""}
      <p class="note">ממוין לפי מחיר סופי עד הבית. "דגם דומה" = אותו דגם בלי המק״ט בכותרת, ייתכן זיכרון/אחסון שונה.</p>`
    : `<div class="empty">אין הצעות בסינון הזה.</div>`}`;
  const tf = $("#tf");
  if (tf) tf.oninput = () => { filterText = tf.value.toLowerCase(); const p = tf.selectionStart; renderList(); const n = $("#tf"); n.focus(); n.setSelectionRange(p, p); };
}

function saveRecent(q, best) {
  const list = store.get("bb.admin.recent", []).filter((r) => r.q.toLowerCase() !== q.toLowerCase());
  list.unshift({ q, best, at: Date.now() });
  store.set("bb.admin.recent", list.slice(0, 12));
  renderRecent();
}

function renderRecent() {
  const list = store.get("bb.admin.recent", []);
  if (!list.length) return;
  $("#lastBest").textContent = list[0].best ? ils(list[0].best) : "—";
  $("#lastQ").textContent = "~ " + list[0].q;
  $("#recent").innerHTML = list.map((r) => `
    <div class="item" data-q="${esc(r.q)}">
      <span class="ico">${esc(r.q.trim().charAt(0).toUpperCase())}</span>
      <span class="meta"><b>${esc(r.q)}</b><small>${new Date(r.at).toLocaleDateString("he-IL")}</small></span>
      <span class="val"><b>${r.best ? ils(r.best) : "—"}</b></span>
    </div>`).join("");
  document.querySelectorAll("#recent .item").forEach((el) => el.onclick = () => run(el.dataset.q));
}
renderRecent();
</script>
</body>
</html>
