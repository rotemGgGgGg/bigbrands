<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>ניהול — BIG BRANDS</title>
<style>
  :root {
    --text: #16191f; --muted: #7d838e; --faint: #a3a8b1;
    --glass: rgba(246,247,250,.46); --glass-hi: rgba(255,255,255,.62);
    --edge: rgba(255,255,255,.78); --edge-soft: rgba(255,255,255,.45);
    --blue: #4a6fa5; --ink-blue: #2f4f7f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Inter", system-ui, "Segoe UI", Arial, sans-serif; color: var(--text);
    background: #d9dbe0; overflow-x: hidden;
    padding: max(28px, env(safe-area-inset-top)) 16px 48px;
  }

  /* Soft white 3D folds, like the reference wallpaper */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 10%, #f4f5f7 0%, #dcdee3 55%, #c9ccd3 100%); }
  .bg svg { position: absolute; width: 140%; height: 140%; left: -20%; top: -20%; filter: blur(2px); }

  .stage { position: relative; max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; }
  .glass {
    position: relative; border-radius: 26px; background: var(--glass);
    backdrop-filter: blur(30px) saturate(140%); -webkit-backdrop-filter: blur(30px) saturate(140%);
    border: 1px solid var(--edge-soft);
    box-shadow: 0 40px 80px -20px rgba(30,35,48,.28), 0 2px 0 rgba(255,255,255,.7) inset, 0 -1px 0 rgba(255,255,255,.25) inset;
  }
  /* glossy reflection along the top edge */
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 70%, rgba(255,255,255,.18) 100%); }
  .glass > * { position: relative; }

  /* back card (recent searches) sits behind, offset like the reference */
  .card-back { grid-column: 1; grid-row: 1; margin-top: 46px; margin-inline-end: -60px; padding: 22px 22px 18px 80px; min-height: 520px; }
  .card-front { grid-column: 2; grid-row: 1; padding: 22px; z-index: 2; min-height: 560px; }

  .top { display: flex; align-items: center; gap: 10px; }
  .ava-logo { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); flex: none; }
  .ava-logo img { width: 30px; }
  .addr { font-weight: 600; font-size: 15px; }
  .copy { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--glass-hi); border: 1px solid var(--edge); color: var(--muted); }
  .spacer { flex: 1; }
  .round { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text); text-decoration: none;
    background: var(--glass-hi); border: 1px solid var(--edge); transition: transform .15s, background .15s; }
  .round:hover { transform: scale(1.06); background: #fff; }

  .big { font-size: 40px; font-weight: 500; letter-spacing: -.02em; margin: 22px 0 2px; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 14px; min-height: 20px; }
  .sub a { color: var(--ink-blue); text-decoration: none; font-weight: 600; }

  .search { display: flex; gap: 8px; margin: 18px 0 12px; }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 12px 16px; border-radius: 16px; outline: none; color: var(--text);
    background: rgba(255,255,255,.5); border: 1px solid var(--edge); transition: box-shadow .2s, background .2s; }
  .search input:focus { background: rgba(255,255,255,.75); box-shadow: 0 0 0 4px rgba(74,111,165,.14); }
  .search button { flex: none; width: 46px; border: 1px solid var(--edge); border-radius: 16px; background: var(--glass-hi); color: var(--text); cursor: pointer; display: grid; place-items: center; }
  .search button:hover { background: #fff; }

  .pills { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .pill { padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--muted); cursor: pointer; border: 1px solid transparent; background: none; font-family: inherit; user-select: none; }
  .pill.on, .pill:has(input:checked) { background: var(--glass-hi); color: var(--text); font-weight: 600; border-color: var(--edge); box-shadow: 0 2px 10px rgba(30,35,48,.08); }
  .pill input { display: none; }
  .row-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .srcs { margin-top: 10px; }
  .srcs .pill { font-size: 12px; padding: 5px 11px; }

  .section { color: var(--faint); font-size: 12px; font-weight: 600; margin: 18px 4px 6px; }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 16px; text-decoration: none; color: inherit; border: 1px solid transparent; transition: background .15s, border-color .15s, box-shadow .15s; }
  .item:hover { background: rgba(255,255,255,.5); border-color: var(--edge); box-shadow: 0 6px 18px rgba(30,35,48,.08); }
  .ico { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 13px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta small { display: block; color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val { text-align: left; flex: none; font-variant-numeric: tabular-nums; }
  .val b { display: block; font-size: 14px; font-weight: 600; }
  .val small { display: block; color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .card-front, .card-back, .item, .list { min-width: 0; }
  .used { font-size: 10px; font-weight: 600; padding: 1px 7px; margin-inline-start: 6px; border-radius: 6px; background: rgba(140,90,40,.12); color: #7a4f1d; vertical-align: 1px; }
  .meta small.ptitle { unicode-bidi: plaintext; text-align: right; }
  .empty { color: var(--muted); font-size: 14px; padding: 30px 8px; text-align: center; }
  .status { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .status span { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.4); border: 1px solid var(--edge-soft); color: var(--muted); }
  .status span.err { color: #8a2a2a; }
  .filter { width: 100%; font: inherit; font-size: 13px; padding: 9px 14px; border-radius: 14px; border: 1px solid var(--edge-soft); background: rgba(255,255,255,.35); outline: none; margin-top: 12px; }
  .note { color: var(--faint); font-size: 11.5px; margin: 14px 4px 0; }
  .recent .item { cursor: pointer; }
  .spin { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.15); border-top-color: var(--text); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  @media (max-width: 820px) {
    .stage { grid-template-columns: minmax(0, 1fr); max-width: 460px; }
    .val small { max-width: 110px; }
    .card-back { display: none; }
    .card-front { grid-column: 1; min-height: 0; }
    .big { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e3e5ea"/><stop offset="1" stop-color="#b9bdc6"/></linearGradient>
      <linearGradient id="f2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset=".6" stop-color="#d6d9df"/><stop offset="1" stop-color="#aeb3bd"/></linearGradient>
      <filter id="sh"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a6070" flood-opacity=".25"/></filter>
    </defs>
    <g filter="url(#sh)">
      <path d="M-100 260 C 200 120, 420 420, 700 300 S 1180 60, 1700 240 L1700 420 C 1200 260, 980 560, 700 500 S 180 360, -100 470 Z" fill="url(#f1)"/>
      <path d="M-100 560 C 260 430, 520 720, 860 600 S 1340 380, 1700 560 L1700 760 C 1340 600, 1080 900, 820 820 S 240 660, -100 780 Z" fill="url(#f2)"/>
      <path d="M-100 860 C 300 760, 600 1000, 960 900 S 1400 760, 1700 880 L1700 1100 L-100 1100 Z" fill="url(#f1)"/>
      <path d="M200 -60 C 360 120, 260 240, 420 360 S 700 520, 640 700" stroke="#ffffff" stroke-opacity=".7" stroke-width="70" fill="none" stroke-linecap="round"/>
      <path d="M1180 -60 C 1060 140, 1240 260, 1120 420 S 980 640, 1100 860" stroke="#f1f2f5" stroke-opacity=".8" stroke-width="90" fill="none" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<div class="stage">
  <!-- back card: recent searches (the "Activity" card) -->
  <aside class="glass card-back recent">
    <div class="top">
      <div class="ava-logo"><img src="/assets/logo.png" alt="" /></div>
      <span class="addr">היסטוריה</span>
    </div>
    <div class="big" id="lastBest">—</div>
    <div class="sub" id="lastQ">החיפוש האחרון</div>
    <div class="section">חיפושים אחרונים</div>
    <div class="list" id="recent"><div class="empty">עדיין אין חיפושים</div></div>
  </aside>

  <!-- front card: search + offers (the "Tokens" card) -->
  <main class="glass card-front">
    <div class="top">
      <div class="ava-logo"><img src="/assets/logo.png" alt="" /></div>
      <span class="addr">BIG BRANDS</span>
      <a class="copy" href="/admin/products.html" title="ניהול מוצרים" aria-label="ניהול מוצרים">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
      </a>
      <span class="spacer"></span>
      <a class="round" href="/" title="לאתר" aria-label="לאתר">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 11 12 3l9 8M5 10v10h14V10"/></svg>
      </a>
      <a class="round" href="/admin/logout" title="יציאה" aria-label="יציאה">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
      </a>
    </div>

    <div class="big" id="best">₪0</div>
    <div class="sub" id="bestSub">המחיר הכי טוב עד הבית יופיע כאן</div>

    <form class="search" id="f">
      <input id="q" list="catalog" placeholder="חפש מוצר — שם דגם מלא עובד הכי טוב" autocomplete="off" required />
      <datalist id="catalog"></datalist>
      <button id="go" aria-label="חפש">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      </button>
    </form>

    <div class="row-tools">
      <div class="pills" id="tabs">
        <button class="pill on" data-tab="all">כל ההצעות</button>
        <button class="pill" data-tab="IL">ישראל</button>
        <button class="pill" data-tab="abroad">חו״ל</button>
      </div>
    </div>
    <div class="pills srcs" id="srcs">
      <label class="pill"><input type="checkbox" value="serper" checked />Google</label>
      <label class="pill"><input type="checkbox" value="zap" checked />זאפ</label>
      <label class="pill"><input type="checkbox" value="ivory" checked />Ivory</label>
      <label class="pill"><input type="checkbox" value="aliexpress" />AliExpress</label>
      <label class="pill"><input type="checkbox" value="ebay" />eBay</label>
    </div>

    <div id="results"></div>
  </main>
</div>

<script src="/js/data.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ils = (n) => n == null ? "—" : "₪" + Number(n).toLocaleString("he-IL");
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : "#";
const TONES = ["#5b6f8f","#6f7f99","#4a6fa5","#7a8494","#56708a","#8a93a3","#3f5878","#6b7a8c"];
const tone = (s) => TONES[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % TONES.length];
const SOURCE_NAMES = { serper: "Google", zap: "זאפ", ivory: "Ivory", aliexpress: "AliExpress", ebay: "eBay" };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let data = null, tab = "all", filterText = "";

try {
  $("#catalog").innerHTML = (window.SITE_DATA?.products || []).map((p) => `<option value="${esc(p.name)}"></option>`).join("");
} catch {}

const savedSrc = store.get("bb.admin.sources.v3", null);
if (savedSrc) document.querySelectorAll("#srcs input").forEach((i) => (i.checked = savedSrc.includes(i.value)));

document.querySelectorAll("#tabs .pill").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs .pill").forEach((x) => x.classList.toggle("on", x === b));
  if (data) renderList();
});

$("#f").addEventListener("submit", (e) => { e.preventDefault(); run($("#q").value); });

async function run(query) {
  query = query.trim();
  if (!query) return;
  $("#q").value = query;
  const sources = [...document.querySelectorAll("#srcs input:checked")].map((i) => i.value);
  if (!sources.length) return alert("בחר לפחות מקור אחד");
  store.set("bb.admin.sources.v3", sources);
  $("#go").innerHTML = '<span class="spin"></span>'; $("#go").disabled = true;
  $("#results").innerHTML = "";
  filterText = "";
  try {
    const r = await fetch(`/api/prices?q=${encodeURIComponent(query)}&sources=${sources.join(",")}`, { credentials: "same-origin" });
    if (r.status === 401) { location.reload(); return; }
    data = await r.json();
    if (data.error) throw new Error(data.error);
    saveRecent(query, data.items[0]?.totalILS);
    renderAll();
  } catch (err) {
    $("#results").innerHTML = `<div class="empty">שגיאה: ${esc(err.message)}</div>`;
  } finally {
    $("#go").disabled = false;
    $("#go").innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>';
  }
}

function renderAll() {
  const best = data.items[0];
  $("#best").textContent = best ? ils(best.totalILS) : "אין תוצאות";
  $("#bestSub").innerHTML = best
    ? `~ ${esc(best.store)} · <a href="${esc(safeUrl(best.url))}" target="_blank" rel="noopener noreferrer">לעסקה ←</a>`
    : "נסה שם דגם מלא או מקור נוסף";
  renderList();
}

function row(i) {
  const abroad = i.region !== "IL";
  const sub = [SOURCE_NAMES[{ Google: "serper", Zap: "zap", Ivory: "ivory", AliExpress: "aliexpress", eBay: "ebay" }[i.source]] || i.source,
    i.shippingILS === 0 ? "משלוח חינם" : i.shippingILS ? "משלוח " + ils(i.shippingILS) : "",
    i.delivery].filter(Boolean).join(" · ");
  return `<a class="item" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer" title="${esc(i.title)}">
    <span class="ico" style="background:${tone(i.store)}">${esc((i.store || "?").trim().charAt(0).toUpperCase())}</span>
    <span class="meta"><b>${esc(i.store)}${/מחודש|משומש|יד שני|refurb|renewed|used|open box/i.test(i.title) ? '<span class="used">מחודש</span>' : ""}</b><small class="ptitle">${esc(i.title)}</small></span>
    <span class="val"><b>${ils(i.totalILS)}</b><small>${esc(sub)}${abroad && i.vatILS ? " · כולל מע״מ" : ""}</small></span>
  </a>`;
}

function renderList() {
  let items = data.items.filter((i) => tab === "all" || (tab === "IL" ? i.region === "IL" : i.region !== "IL"));
  if (filterText) items = items.filter((i) => (i.title + " " + i.store).toLowerCase().includes(filterText));
  const status = Object.entries(data.status).map(([k, v]) =>
    v.ok ? `<span>${SOURCE_NAMES[k] || k} ${v.count}</span>` : `<span class="err">${SOURCE_NAMES[k] || k}: ${esc(v.error)}</span>`).join("");

  const cheap = items.slice(0, 10), rest = items.slice(10);
  $("#results").innerHTML = `
    <div class="status">${status}</div>
    ${data.items.length ? `<input class="filter" id="tf" placeholder="סינון בתוצאות…" value="${esc(filterText)}" />` : ""}
    ${items.length ? `
      <div class="section">הכי זולים</div><div class="list">${cheap.map(row).join("")}</div>
      ${rest.length ? `<div class="section">עוד ${rest.length} הצעות</div><div class="list">${rest.map(row).join("")}</div>` : ""}
      <p class="note">${items.length} הצעות מכל המקורות, ממוינות לפי מחיר סופי עד הבית.</p>`
    : `<div class="empty">אין הצעות בסינון הזה.</div>`}`;

  const tf = $("#tf");
  if (tf) tf.oninput = () => { filterText = tf.value.toLowerCase(); const p = tf.selectionStart; renderList(); const n = $("#tf"); n.focus(); n.setSelectionRange(p, p); };
}

function saveRecent(q, best) {
  const list = store.get("bb.admin.recent", []).filter((r) => r.q.toLowerCase() !== q.toLowerCase());
  list.unshift({ q, best, at: Date.now() });
  store.set("bb.admin.recent", list.slice(0, 12));
  renderRecent();
}

function renderRecent() {
  const list = store.get("bb.admin.recent", []);
  if (!list.length) return;
  $("#lastBest").textContent = list[0].best ? ils(list[0].best) : "—";
  $("#lastQ").textContent = "~ " + list[0].q;
  $("#recent").innerHTML = list.map((r) => `
    <div class="item" data-q="${esc(r.q)}">
      <span class="ico" style="background:${tone(r.q)}">${esc(r.q.trim().charAt(0).toUpperCase())}</span>
      <span class="meta"><b>${esc(r.q)}</b><small>${new Date(r.at).toLocaleDateString("he-IL")}</small></span>
      <span class="val"><b>${r.best ? ils(r.best) : "—"}</b></span>
    </div>`).join("");
  document.querySelectorAll("#recent .item").forEach((el) => el.onclick = () => run(el.dataset.q));
}
renderRecent();
</script>
</body>
</html>
