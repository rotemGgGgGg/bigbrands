<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>ניהול — BIG BRANDS</title>
<style>
  :root {
    --text: #1b2232; --muted: #6b7486; --faint: #98a1b2;
    --glass: rgba(255,255,255,.42); --glass-strong: rgba(255,255,255,.62); --edge: rgba(255,255,255,.75);
    --blue: #3b6fd8; --green: #12805c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, "Segoe UI", Arial, sans-serif; color: var(--text);
    background:
      radial-gradient(1100px 650px at 15% 0%, #fff 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 100%, #c9d3e3 0%, transparent 60%),
      radial-gradient(700px 500px at 0% 100%, #dfe5ee 0%, transparent 65%),
      linear-gradient(140deg, #eceff4 0%, #d5dbe5 100%);
    background-attachment: fixed;
    padding: max(18px, env(safe-area-inset-top)) 16px 40px;
  }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
    border: 1px solid var(--edge); border-radius: 28px;
    box-shadow: 0 28px 70px rgba(40,55,85,.16), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .app { max-width: 760px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; margin-bottom: 14px; }
  .logo { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .logo img { width: 34px; }
  header b { font-size: 16px; }
  header small { display: block; color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text);
    background: var(--glass-strong); border: 1px solid var(--edge); text-decoration: none; transition: transform .15s; }
  .icon-btn:hover { transform: scale(1.06); }

  .panel { padding: 22px; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.35); border: 1px solid var(--edge); margin-bottom: 18px; }
  .tabs a { padding: 8px 16px; border-radius: 999px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .tabs a.on { background: var(--glass-strong); color: var(--text); font-weight: 600; box-shadow: 0 2px 8px rgba(40,55,85,.1); }

  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; min-width: 0; font-size: 17px; padding: 15px 18px; border-radius: 18px; outline: none; color: var(--text);
    background: var(--glass-strong); border: 1px solid var(--edge); transition: box-shadow .2s;
  }
  .search input:focus { box-shadow: 0 0 0 4px rgba(59,111,216,.16); }
  .search button {
    flex: none; padding: 0 22px; border: 0; border-radius: 18px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #3b6fd8, #5f8ff0); box-shadow: 0 10px 24px rgba(59,111,216,.3);
  }
  .search button:disabled { opacity: .6; cursor: wait; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; font-size: 13px; cursor: pointer; user-select: none;
    background: rgba(255,255,255,.3); border: 1px solid var(--edge); color: var(--muted); }
  .chip input { display: none; }
  .chip:has(input:checked) { background: var(--glass-strong); color: var(--text); font-weight: 600; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .chip:has(input:checked) .dot { background: var(--blue); }

  .hero { margin-top: 18px; padding: 22px; }
  .hero .label { color: var(--muted); font-size: 13px; }
  .hero .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .hero .meta { color: var(--muted); font-size: 14px; }
  .hero a { color: var(--blue); font-weight: 600; text-decoration: none; }
  .status { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .status span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.4); color: var(--muted); }
  .status span.err { color: #b42318; }

  .list { margin-top: 14px; padding: 8px; }
  .filter { padding: 8px 10px 4px; }
  .filter input { width: 100%; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--edge); background: rgba(255,255,255,.45); font-size: 14px; outline: none; }
  .group { color: var(--faint); font-size: 12px; font-weight: 600; padding: 12px 14px 4px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; text-decoration: none; color: inherit; transition: background .15s; }
  .row:hover { background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px var(--edge); }
  .ava { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
  .info { flex: 1; min-width: 0; }
  .info b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { text-align: left; flex: none; font-variant-numeric: tabular-nums; }
  .amt b { display: block; font-size: 15px; }
  .amt small { display: block; color: var(--muted); font-size: 12px; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: rgba(18,128,92,.12); color: var(--green); margin-inline-start: 6px; vertical-align: middle; }
  .tag.abroad { background: rgba(59,111,216,.12); color: var(--blue); }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  .note { color: var(--faint); font-size: 12px; padding: 10px 14px 6px; }
  .spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes s { to { transform: rotate(360deg); } }

  @media (max-width: 520px) {
    .panel, .hero { padding: 18px; }
    .hero .big { font-size: 34px; }
    .search button { padding: 0 16px; }
    .row { padding: 11px 10px; gap: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="glass">
    <div class="logo"><img src="/assets/logo.png" alt="" /></div>
    <div><b>BIG BRANDS</b><small>מערכת ניהול</small></div>
    <div class="spacer"></div>
    <a class="icon-btn" href="/" title="לאתר" aria-label="לאתר">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11 12 3l9 8M5 10v10h14V10"/></svg>
    </a>
    <a class="icon-btn" href="/admin/logout" title="יציאה" aria-label="יציאה">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
    </a>
  </header>

  <section class="glass panel">
    <nav class="tabs">
      <a class="on" href="/admin/">חיפוש מחירים</a>
      <a href="/admin/products.html">ניהול מוצרים</a>
    </nav>
    <form class="search" id="f">
      <input id="q" list="catalog" placeholder="מחשב, מסך, מק״ט… למשל DN6M7ET" autocomplete="off" required />
      <datalist id="catalog"></datalist>
      <button id="go">חפש</button>
    </form>
    <div class="chips" id="srcs">
      <label class="chip"><input type="checkbox" value="zap" checked /><span class="dot"></span>זאפ · כל החנויות בישראל</label>
      <label class="chip"><input type="checkbox" value="ivory" checked /><span class="dot"></span>Ivory</label>
      <label class="chip"><input type="checkbox" value="aliexpress" /><span class="dot"></span>AliExpress</label>
      <label class="chip"><input type="checkbox" value="google_il" /><span class="dot"></span>Google ישראל</label>
      <label class="chip"><input type="checkbox" value="google_us" /><span class="dot"></span>Google ארה״ב</label>
      <label class="chip"><input type="checkbox" value="ebay" /><span class="dot"></span>eBay</label>
    </div>
  </section>

  <div id="out"></div>
</div>

<script src="/js/data.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ils = (n) => n == null ? "—" : Number(n).toLocaleString("he-IL") + " ₪";
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : "#";
const COLORS = ["#4f7be8","#7b5cd6","#1f9d74","#e0794b","#d6497b","#2f8fb8","#8a6d3b","#5b6577"];
const colorFor = (s) => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const SOURCE_NAMES = { ivory: "Ivory", aliexpress: "AliExpress", zap: "זאפ", google_il: "Google IL", google_us: "Google US", ebay: "eBay" };
let data = null, filterText = "";

try {
  $("#catalog").innerHTML = (window.SITE_DATA?.products || [])
    .map((p) => `<option value="${esc(p.mpn || p.name)}">${esc(p.name)}</option>`).join("");
} catch {}

try {
  const saved = JSON.parse(localStorage.getItem("bb.admin.sources") || "null");
  if (saved) document.querySelectorAll("#srcs input").forEach((i) => (i.checked = saved.includes(i.value)));
} catch {}

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const sources = [...document.querySelectorAll("#srcs input:checked")].map((i) => i.value);
  if (!sources.length) return alert("בחר לפחות מקור אחד");
  try { localStorage.setItem("bb.admin.sources", JSON.stringify(sources)); } catch {}
  const btn = $("#go");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  $("#out").innerHTML = "";
  filterText = "";
  try {
    const r = await fetch(`/api/prices?q=${encodeURIComponent($("#q").value)}&sources=${sources.join(",")}`, { credentials: "same-origin" });
    if (r.status === 401) { location.reload(); return; }
    data = await r.json();
    if (data.error) throw new Error(data.error);
    render();
  } catch (err) {
    $("#out").innerHTML = `<section class="glass hero"><div class="empty">שגיאה: ${esc(err.message)}</div></section>`;
  } finally { btn.disabled = false; btn.textContent = "חפש"; }
});

function row(i) {
  const abroad = i.region !== "IL";
  const sub = [i.shippingILS === 0 ? "משלוח חינם" : i.shippingILS ? "משלוח " + ils(i.shippingILS) : "", i.delivery, i.source + (abroad ? " " + i.region : "")].filter(Boolean).join(" · ");
  const detail = abroad && i.vatILS ? `כולל מע״מ ${ils(i.vatILS)}` : i.title;
  return `<a class="row" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer">
    <span class="ava" style="background:${colorFor(i.store)}">${esc((i.store || "?").trim().charAt(0).toUpperCase())}</span>
    <span class="info"><b>${esc(i.store)}<span class="tag${abroad ? " abroad" : ""}">${abroad ? "חו״ל" : "ישראל"}</span></b><small>${esc(sub)}</small></span>
    <span class="amt"><b>${ils(i.totalILS)}</b><small>${esc(abroad && i.vatILS ? detail : "")}</small></span>
  </a>`;
}

function render() {
  const status = Object.entries(data.status).map(([k, v]) =>
    v.ok ? `<span>${SOURCE_NAMES[k]}: ${v.count}</span>` : `<span class="err">${SOURCE_NAMES[k]}: ${esc(v.error)}</span>`).join("");
  const best = data.items[0];
  const items = data.items.filter((i) => !filterText || (i.title + " " + i.store).toLowerCase().includes(filterText));

  // Group offers by model so different configurations don't mix in one ranking.
  const groups = new Map();
  for (const i of items) {
    const k = i.source === "Zap" ? i.title : "הצעות נוספות";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  }

  $("#out").innerHTML = `
    <section class="glass hero">
      ${best ? `
        <div class="label">המחיר הכי טוב עד הבית</div>
        <div class="big">${ils(best.totalILS)}</div>
        <div class="meta">${esc(best.store)} · ${esc(best.title)}<br><a href="${esc(safeUrl(best.url))}" target="_blank" rel="noopener noreferrer">לעסקה ←</a></div>`
      : `<div class="empty">לא נמצאו הצעות. נסה מק״ט מדויק או מקור נוסף.</div>`}
      <div class="status">${status}<span>דולר ${data.usdIls} ₪</span>${data.cached ? "<span>מהזיכרון</span>" : ""}</div>
    </section>
    ${data.items.length ? `
    <section class="glass list">
      <div class="filter"><input id="tf" placeholder="סינון בתוצאות…" value="${esc(filterText)}" /></div>
      ${[...groups].map(([name, list]) => `<div class="group">${esc(name)} · ${list.length}</div>${list.map(row).join("")}`).join("")}
      <div class="note">${items.length} הצעות, ממוינות לפי מחיר סופי. מע״מ יבוא הוא הערכה. הצעות מחו״ל בדרך כלל בלי אחריות יבואן.</div>
    </section>` : ""}`;

  const tf = $("#tf");
  if (tf) tf.oninput = () => { filterText = tf.value.toLowerCase(); const p = tf.selectionStart; render(); const n = $("#tf"); n.focus(); n.setSelectionRange(p, p); };
}
</script>
</body>
</html>
