<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REBIRTH 15s</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root { --white: #F4F3F0; --silver: #B9BCC2; --mute: #8E9096; --hair: rgba(255,255,255,.18); }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  .ab { position: absolute; }
  .clip { overflow: hidden; }
  .clip > span { display: block; will-change: transform; }

  /* light */
  #spot { left: 760px; top: -60px; width: 1200px; height: 1200px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(78,79,84,.55), rgba(40,40,43,.28) 45%, rgba(0,0,0,0) 100%); }
  #vignette { inset: 0; background: radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }

  /* logo (original artwork, scaled only) */
  #logo { left: 580px; top: 271px; width: 760px; height: 438px; transform-origin: 0 0;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 55%, transparent 100%);
    -webkit-mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; -webkit-mask-position: var(--m, 100%) 0; }
  #logo img { width: 760px; height: 438px; display: block; }

  /* watch (store cutout) */
  #w { left: 1070px; top: 240px; width: 540px; height: 600px; transform-origin: 50% 50%; }
  #wd { width: 540px; height: 600px; }
  #wd img { width: 540px; height: 600px; display: block; object-fit: contain;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 15%, #000 74%, transparent 97%); }

  /* type */
  .bodoni { font-family: 'Bodoni Moda', serif; font-weight: 500; color: var(--white); text-transform: uppercase; }
  .heebo { font-family: 'Heebo', sans-serif; }
  #s1name { left: 210px; top: 418px; font-size: 104px; line-height: 1.15; letter-spacing: .28em; }
  #s1line { left: 214px; top: 566px; width: 120px; height: 1px; background: var(--silver); transform-origin: 0 50%; }
  #s1by { left: 212px; top: 590px; font-size: 26px; letter-spacing: .45em; color: var(--mute); text-transform: uppercase; font-weight: 400; }

  #s2model { left: 212px; top: 300px; font-size: 26px; letter-spacing: .35em; color: var(--silver); }
  .hair { left: 210px; width: 760px; height: 1px; background: var(--hair); transform-origin: 0 50%; }
  #h1 { top: 476px; } #h2 { top: 604px; }
  #mark { left: 196px; top: 506px; width: 2px; height: 68px; background: var(--white); transform-origin: 50% 50%; }
  #list { left: 210px; top: 540px; width: 900px; height: 0; }
  .ln { position: absolute; left: 0; top: -38px; height: 76px; line-height: 76px; white-space: nowrap;
    font: 500 58px 'Heebo', sans-serif; letter-spacing: .08em; color: var(--white); text-transform: uppercase; transform-origin: 0 50%; }

  #box { left: 910px; top: 90px; width: 900px; height: 900px; transform-origin: 50% 55%;
    -webkit-mask-image: radial-gradient(closest-side, #000 80%, transparent 100%); }
  #box img { width: 900px; height: 900px; display: block; }
  #cta { left: 212px; top: 452px; font-size: 52px; line-height: 1.24; letter-spacing: .17em; }
  #s3line { left: 214px; top: 600px; width: 90px; height: 1px; background: var(--silver); transform-origin: 0 50%; }
  #url { left: 210px; top: 622px; font: 500 46px 'Heebo', sans-serif; letter-spacing: .03em; color: var(--white); }
</style>
</head>
<body>
<div id="stage">
  <div class="ab" id="spot"></div>

  <div class="ab" id="box"><img src="assets/img/skeleton-phantom-box.webp" alt=""></div>
  <div class="ab" id="w"><div id="wd"><img src="assets/img/skeleton-phantom-cutout.webp" alt=""></div></div>

  <!-- scene 1 -->
  <div class="ab bodoni clip" id="s1name"><span>Rebirth</span></div>
  <div class="ab" id="s1line"></div>
  <div class="ab heebo clip" id="s1by"><span>by RTM Watches</span></div>

  <!-- scene 2 -->
  <div class="ab bodoni clip" id="s2model"><span>Skeleton Phantom</span></div>
  <div class="ab hair" id="h1"></div><div class="ab hair" id="h2"></div>
  <div class="ab" id="mark"></div>
  <div class="ab" id="list">
    <div class="ln" id="l0">Presented in a gift box</div>
    <div class="ln" id="l1">Delivered to your door</div>
    <div class="ln" id="l2">30-day returns</div>
  </div>

  <!-- scene 3 -->
  <div class="ab bodoni" id="cta"><div class="clip"><span>Discover</span></div><div class="clip"><span>the collection</span></div></div>
  <div class="ab" id="s3line"></div>
  <div class="ab clip" id="url"><span>rtmwatches.store</span></div>

  <div class="ab" id="logo"><img src="assets/img/rtm-logo.png" alt="RTM Watches"></div>
  <div class="ab" id="vignette"></div>
</div>

<script src="../../assets/vendor/gsap.min.js"></script>
<script>
const FPS = 30, DURATION = 15;
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

/* ---------- Scene 1: brand introduction (0-5s) ---------- */
tl.fromTo('#spot', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 3.2, ease: 'power2.inOut' }, 0.2);
tl.fromTo('#logo', { '--m': '100%', opacity: 0, scale: 1.03 }, { '--m': '0%', opacity: 1, scale: 1, duration: 1.3, ease: 'power2.out' }, 0.3);
// logo settles into a small mark, top left
tl.to('#logo', { x: -470, y: -185, scale: 0.3026, duration: 0.9, ease: 'power3.inOut' }, 1.75);
tl.fromTo('#w', { opacity: 0, y: 90, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 1.7, ease: 'power3.out' }, 2.2);
tl.fromTo('#s1name span', { yPercent: 105 }, { yPercent: 0, duration: 0.9 }, 2.45);         // VO "Rebirth" 2.25-2.93
tl.fromTo('#s1line', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power2.inOut' }, 3.0);
tl.fromTo('#s1by span', { yPercent: 105 }, { yPercent: 0, duration: 0.8 }, 3.25);          // VO "RTM" 3.35
tl.to(['#s1name span', '#s1by span'], { yPercent: -105, duration: 0.55, ease: 'power3.in', stagger: 0.06 }, 4.55);
tl.to('#s1line', { scaleX: 0, transformOrigin: '100% 50%', duration: 0.5, ease: 'power3.in' }, 4.55);

/* ---------- Scene 2: benefits through a focus band (5-10s) ---------- */
tl.to('#w', { x: 40, scale: 1.08, duration: 1.0, ease: 'power3.inOut' }, 4.7);
tl.to('#w', { scale: 1.12, duration: 4.0, ease: 'none' }, 5.7);                             // restrained push
tl.to('#spot', { x: 40, duration: 1.0, ease: 'power3.inOut' }, 4.7);
tl.fromTo('#s2model span', { yPercent: 105 }, { yPercent: 0, duration: 0.8 }, 5.2);
tl.fromTo('.hair', { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: 'power2.inOut', stagger: 0.08 }, 5.05);
tl.fromTo('#mark', { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: 'power2.out' }, 5.3);

const GAP = 112, ON = { scale: 1, opacity: 1, filter: 'blur(0px)' }, OFF = { scale: 0.6, opacity: 0.3, filter: 'blur(3px)' }, GONE = { scale: 0.5, opacity: 0, filter: 'blur(6px)' };
const look = d => d === 0 ? ON : Math.abs(d) === 1 ? OFF : GONE;
const lines = ['#l0', '#l1', '#l2'];
// initial layout: line 0 in the band, the others below
lines.forEach((l, i) => tl.set(l, { y: i * GAP, ...look(i) }, 0));
tl.fromTo('#list', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 }, 5.3);       // VO "Every watch arrives in a gift box"
const ACT = [[7.0, 1], [8.1, 2]];                                                          // VO "delivered" 7.05, "with thirty-day" 8.12
ACT.forEach(([t, a]) => {
  lines.forEach((l, i) => tl.to(l, { y: (i - a) * GAP, ...look(i - a), duration: 0.6, ease: 'power3.inOut' }, t));
  tl.fromTo('#mark', { scaleY: 0.4 }, { scaleY: 1, duration: 0.6, ease: 'power3.out', immediateRender: false }, t + 0.1);
});
tl.to(['#list', '.hair', '#mark'], { opacity: 0, x: -30, duration: 0.5, ease: 'power3.in' }, 9.65);
tl.to('#s2model span', { yPercent: -105, duration: 0.5, ease: 'power3.in' }, 9.6);
tl.to('#w', { opacity: 0, scale: 1.16, filter: 'blur(6px)', duration: 0.6, ease: 'power2.in' }, 9.7);

/* ---------- Scene 3: call to action (10-15s) ---------- */
tl.fromTo('#box', { opacity: 0, y: 24, scale: 1 }, { opacity: 1, y: 0, duration: 1.0, ease: 'power2.out' }, 10.0);
tl.fromTo('#box', { scale: 1 }, { scale: 1.08, duration: 5.0, ease: 'power1.inOut', immediateRender: false }, 10.0);   // camera push
tl.to('#spot', { x: 0, opacity: 0.8, duration: 1.2, ease: 'power2.inOut' }, 10.0);
tl.fromTo('#cta .clip:nth-child(1) span', { yPercent: 105 }, { yPercent: 0, duration: 0.9 }, 10.45);   // VO "Discover" 10.45
tl.fromTo('#cta .clip:nth-child(2) span', { yPercent: 105 }, { yPercent: 0, duration: 0.9 }, 10.75);
tl.fromTo('#s3line', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power2.inOut' }, 11.3);
tl.fromTo('#url span', { yPercent: 105 }, { yPercent: 0, duration: 0.85 }, 11.6);         // VO "RTM Watches dot store" 11.67
// brand frame: the mark grows into place above the call to action
tl.to('#logo', { x: -370, y: -79, scale: 0.42, duration: 1.2, ease: 'power3.inOut' }, 12.9);
tl.to({}, { duration: 0.01 }, DURATION - 0.01);

// slow ambient float of the watch (pure function of time, kept off the GSAP-tweened element)
function ambient(t) {
  document.getElementById('wd').style.transform = `translateY(${Math.sin(t * 0.9) * 6}px)`;
}
window.DURATION = DURATION;
window.FPS = FPS;
window.seek = t => { tl.seek(t, false); ambient(t); };
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
window.seek(0);
</script>
</body>
</html>
